<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="kaushan-script.woff2" as="font" type="font/woff2" crossorigin>
<title>Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0c0f; --card:rgba(24,26,32,.78); --card2:rgba(44,47,56,.72); --line:rgba(255,255,255,.07);
  --text:#f2f3f5; --muted:#8b919c; --acc:#22d3ee; --acc-ink:#121400;
  --red:#ff5c5c; --blue:#5cb3ff; --orange:#ffa94d; --violet:#b48cff; --green:#4ade80;
  --r:16px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* geen tekst selecteren of lang-indrukken-menu (behalve in invulvelden) */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;user-drag:none;pointer-events:auto}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
input[type=date]{min-height:46px}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0}
.app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 112px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
header.top h1{font-family:"Kaushan Script",cursive;font-weight:400;font-size:46px;line-height:1.1;letter-spacing:0;padding:2px 10px 8px 2px;margin:0 0 -8px -2px;
  background:linear-gradient(100deg,#ffffff 0%,#38bdf8 45%,#e6fbff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .hello{color:#e8f9ff;opacity:.75;font-size:14px;font-weight:600}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
body{background:transparent!important}
#bgfx{position:fixed;inset:0;z-index:-1;contain:strict;transform:translateZ(0);overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#04090c 0%,#0b0c0f 55%,#0a0c0b 100%)}
#bgfx i{position:absolute;border-radius:50%;opacity:.55}
html.fx #bgfx i{will-change:transform}
#bgfx .b1{width:420px;height:420px;left:-120px;top:-140px;background:radial-gradient(circle,#0891b2 0%,rgba(6,182,212,0) 70%)}
#bgfx .b2{width:380px;height:380px;right:-160px;top:18%;background:radial-gradient(circle,#22d3ee 0%,rgba(34,211,238,0) 70%);opacity:.35}
#bgfx .b3{width:460px;height:460px;left:-80px;bottom:-200px;background:radial-gradient(circle,#e0f2fe 0%,rgba(184,230,54,0) 70%);opacity:.22}
#bgfx .b4{width:340px;height:340px;right:-80px;bottom:18%;background:radial-gradient(circle,#ff9a5a 0%,rgba(255,154,90,0) 70%);opacity:.16}
#bgfx::after{content:"";position:absolute;inset:0;opacity:.035;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#bgfx .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 60%);mask-image:linear-gradient(180deg,#000 0%,transparent 60%);border-radius:0;filter:none;opacity:1;width:auto;height:auto}
html.fx #bgfx .b1{animation:drift1 26s ease-in-out infinite alternate}html.fx #bgfx .b2{animation:drift2 32s ease-in-out infinite alternate}html.fx #bgfx .b3{animation:drift3 38s ease-in-out infinite alternate}html.fx #bgfx .b4{animation:drift2 30s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(120px,90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-110px,120px) scale(.9)}}
@keyframes drift3{to{transform:translate(140px,-100px) scale(1.1)}}
@media (prefers-reduced-motion:reduce){#bgfx i{animation:none}}
.card,.stat,.list,.meal,.mtile,.daynav,.ex,.pk-card{border:1px solid rgba(255,255,255,.06)}
.hero{}
.today{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;margin-bottom:10px;background:rgba(24,26,32,.7);border:1px solid rgba(255,255,255,.06)}
.today .ti{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.06)}
.today.done .ti{background:linear-gradient(135deg,#22d3ee,#e6fbff);color:#00151b}
.today b{display:block;font-family:Archivo;font-size:16px}
.today span{font-size:12px;color:var(--muted)}
.today .go{margin-left:auto;font-size:13px;font-weight:800;color:#00151b;background:linear-gradient(100deg,#22d3ee,#e6fbff);padding:8px 12px;border-radius:11px;white-space:nowrap}
.hero{border-radius:22px;padding:16px;margin-bottom:10px;background:linear-gradient(160deg,rgba(34,211,238,.16),rgba(23,25,30,.9) 55%);border:1px solid rgba(103,232,249,.16)}
.hero-label{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#9be7f7}
.hero-big{font-family:Archivo;font-size:40px;font-weight:800;line-height:1.1}
.hero-big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
.streak{background:rgba(34,211,238,.15);color:#22d3ee;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;text-align:center}
.streak small{display:block;font-size:11px;font-weight:600;opacity:.75}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd span{font-size:11px;color:var(--muted);font-weight:600}
.wd i{font-style:normal;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:rgba(255,255,255,.05);color:var(--muted)}
.wd.future i{opacity:.45}
.wd.today i{border:2px solid #38bdf8;color:#e8f9ff}
.wd.today span{color:#38bdf8}
.wd.done i{background:linear-gradient(135deg,#22d3ee,#e6fbff);color:#00151b;box-shadow:0 4px 14px rgba(34,211,238,.35)}
.wd.done i svg{width:18px;height:18px}
.btn.big{padding:16px;font-size:16px;border-radius:16px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li b{display:block;font-weight:700}
.li span{font-size:12px;color:var(--muted)}
.li .pr{text-align:right}.li .pr b{font-family:Archivo;color:#22d3ee}.li .pr span{color:var(--acc)}
.card.next{border:1px solid rgba(255,255,255,.05)}
.card.wcard{display:flex;gap:12px;align-items:stretch}
.dblock{flex:none;width:50px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.dblock b{font-family:Archivo;font-size:22px;line-height:1}
.dblock span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-top:3px}
.wbody{flex:1;min-width:0}
.wbody .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.chipsx{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chipx{font-size:12px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.05);color:#c9cdd4}
.chipx.more{color:#22d3ee}
.banner{background:rgba(8,51,68,.75);border:1px solid rgba(34,211,238,.3);color:#bff3fd;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Archivo;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(100deg,#22d3ee,#e6fbff);color:#00151b;border:0;box-shadow:0 8px 24px rgba(34,211,238,.22)}
.btn.danger{background:transparent;color:var(--red);border-color:#4a2626}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.section-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin:20px 2px 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;display:block;width:100%;text-align:left}
.card:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.w-date{font-size:12px;color:var(--muted);font-weight:600;text-transform:capitalize}
.w-name{font-family:Archivo;font-size:18px;font-weight:700;margin:2px 0 6px}
.w-ex{color:var(--muted);font-size:13px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.acc{background:rgba(200,255,46,.12);color:var(--acc)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:40px;margin-bottom:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(13,14,17,0),rgba(13,14,17,.94) 28%);padding:14px 14px calc(var(--sab) + 10px);display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;gap:6px;max-width:560px;width:100%}
nav.tabs button{flex:1 1 0;min-width:0;height:58px;display:flex;align-items:center;justify-content:center;gap:0;border-radius:18px;
  background:rgba(31,34,41,.97);border:1px solid rgba(255,255,255,.06);color:#9aa0aa;
  transition:flex-grow .4s cubic-bezier(.3,.8,.2,1),background .3s,color .3s,box-shadow .3s,gap .3s}
nav.tabs button:active{transform:scale(.96)}
nav.tabs button.on{flex-grow:2.3;gap:8px;color:#00151b;border-color:transparent;background:linear-gradient(100deg,#22d3ee,#e6fbff);box-shadow:0 8px 22px rgba(34,211,238,.3)}
nav.tabs button span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:15px;transition:max-width .4s cubic-bezier(.3,.8,.2,1),opacity .25s}
nav.tabs button.on span{max-width:130px;opacity:1;transition-delay:0s,.12s}
nav.tabs svg{width:24px;height:24px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{opacity:.6;margin-left:4px}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none}
.sheet-wrap.open{display:block}
.sheet{position:absolute;inset:0;top:calc(var(--sat) + 10px);background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:17px}
.sheet-head .link{color:var(--muted);font-weight:600;padding:6px 2px}
.sheet-head .save{color:var(--acc);font-weight:800;padding:6px 2px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px calc(var(--sab) + 40px);-webkit-overflow-scrolling:touch}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:12px}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-head input{font-weight:700}
.iconbtn{width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--card2)}
.iconbtn svg{width:18px;height:18px}
.prev{font-size:12px;color:var(--acc);margin:8px 2px 4px;opacity:.85}
.sets{margin-top:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:6px}
.set .no{color:var(--muted);font-weight:700;text-align:center;font-size:13px}
.set input{text-align:center;padding:9px 6px}
.set-h{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;font-size:11px;color:var(--muted);font-weight:600;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.set .x{height:36px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.copybox{background:rgba(200,255,46,.08);border:1px dashed rgba(200,255,46,.4);color:var(--acc);border-radius:12px;padding:11px;width:100%;font-weight:600;font-size:14px;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
/* progress */
.chart{background:var(--card);border-radius:var(--r);padding:12px 8px 6px;margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rec{background:var(--card);border-radius:14px;padding:12px}
.rec b{font-family:Archivo;font-size:20px;display:block}
.rec span{font-size:12px;color:var(--muted)}
.hist{background:var(--card);border-radius:var(--r);overflow:hidden}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
/* content */
.c-title{font-weight:700;font-size:16px;margin:0 0 4px}
.c-hook{color:var(--muted);font-size:13px;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
.st-Idee{background:rgba(180,140,255,.14);color:var(--violet)}
.st-Gepland{background:rgba(92,179,255,.14);color:var(--blue)}
.st-Opgenomen{background:rgba(255,169,77,.14);color:var(--orange)}
.st-Bewerkt{background:rgba(255,217,112,.14);color:#ffd970}
.st-Gepost{background:rgba(74,222,128,.14);color:var(--green)}
.adv{margin-left:auto;font-size:12px;font-weight:700;color:var(--acc);padding:6px 8px;border-radius:8px;background:rgba(200,255,46,.08)}
.late{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 100px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--sab) + 96px);width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#22d3ee,#e6fbff);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(200,255,46,.25);z-index:15}
.fab svg{width:28px;height:28px}
/* schema's */
.wt-row{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.wt-row::-webkit-scrollbar{display:none}
.wt-card{position:relative;flex:none;width:150px;scroll-snap-align:start;border-radius:20px;background:linear-gradient(160deg,rgba(34,211,238,.14),var(--card) 60%);border:1px solid rgba(103,232,249,.14);text-align:left}
.wt-main{display:block;width:100%;padding:12px;text-align:left}
.wt-ths{display:flex;margin-bottom:10px}
.wt-th{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--card);margin-right:-12px}
.wt-th.noimg svg{width:20px;height:20px}
.wt-card b{display:block;font-family:"Kaushan Script",cursive;font-weight:400;font-size:24px;line-height:1.15;padding-right:4px;background:linear-gradient(100deg,#ffffff,#38bdf8 50%,#e6fbff);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-card span{display:block;font-size:12px;color:var(--muted)}
.wt-card em{display:inline-block;margin-top:10px;font-style:normal;font-size:12px;font-weight:800;color:#00151b;background:linear-gradient(100deg,#22d3ee,#e6fbff);padding:5px 10px;border-radius:9px}
.wt-edit{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.35);color:#e8f9ff;font-size:15px}
.wt-new{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:14px;background:var(--card);border:1.5px dashed rgba(103,232,249,.35);min-height:150px}
.wt-new i{font-style:normal;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#e6fbff);color:#00151b;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.wt-new b{font-family:Archivo;font-size:16px;background:none;-webkit-background-clip:initial;background-clip:initial;color:#fff}
.tpl-pick{margin-bottom:12px}.tpl-pick small{opacity:.6;margin-left:3px}
.tpl-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.tpl-ctl .stepper input{width:48px}
.tpl-ord{display:flex;flex-direction:column;gap:4px}
.tpl-ord button{width:34px;height:26px;border-radius:8px;background:var(--card2);color:#22d3ee;font-size:11px}
.tpl-ord button:disabled{opacity:.3}
/* doelen & progressie */
.goalrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid rgba(255,77,77,.25);border-radius:14px;padding:8px 10px;margin:0 0 8px;font-weight:700;font-size:14px;flex-wrap:wrap}
.goalrow input{width:76px;padding:7px 8px;text-align:center;font-weight:700}
.goalrow b{margin-left:auto;color:#ff8080;font-size:13px}.goalrow b.done{color:#22d3ee}
.goalbar{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;margin:-2px 2px 10px}.goalbar i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#e6fbff);border-radius:6px}
.tpl-goal{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}.tpl-goal input{width:58px;padding:8px 4px;text-align:center}
.exgoal{display:block;color:#ff8080!important;font-weight:600;margin-top:2px}
.exprog{margin:8px 2px 0;padding:7px 10px;border-radius:10px;background:rgba(34,211,238,.14);color:#7fe7fb;font-size:13px;font-weight:800;animation:popIn .35s cubic-bezier(.2,1.3,.4,1)}
.set.up input{border-color:rgba(34,211,238,.7);background:rgba(34,211,238,.1)}
.set.up .no{color:#22d3ee;font-size:16px}

.list .frow:last-child{border-bottom:0}
.fadd{width:100%;text-align:left;padding:10px;color:#22d3ee;font-weight:700;font-size:14px}
.calcbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calcbox div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}

.calcbox span{font-size:12px;color:var(--muted)}
.wkchart .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:120px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.btrack{position:relative;flex:1;width:100%;max-width:26px;border-radius:8px;background:rgba(255,255,255,.04)}
.btrack em{position:absolute;left:0;right:0;bottom:0;border-radius:8px;background:linear-gradient(180deg,#e6fbff,#22d3ee)}
.btrack em.over{background:linear-gradient(180deg,#ff8a7a,#ff5c5c)}
.btrack .goal{position:absolute;left:-3px;right:-3px;height:2px;background:rgba(255,255,255,.35);border-radius:2px}
.bcol span{font-size:11px;color:var(--muted);text-transform:uppercase}
/* streak */
.flame{display:inline-block;width:22px;height:28px;vertical-align:-6px}
.flame svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(6,182,212,.6))}
.flame .f1{transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite}
.flame .f2{transform-origin:50% 100%;animation:flick 1s ease-in-out infinite reverse}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.04,.96) skewX(-2deg)}50%{transform:scale(.97,1.06) skewX(2deg)}75%{transform:scale(1.02,.98) skewX(-1deg)}}
.streak{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.streak .row1{display:flex;align-items:center;gap:6px;font-family:Archivo;font-size:22px;font-weight:800;color:#bff3fd}
.streak.cold{background:rgba(255,255,255,.05);color:var(--muted)}
.streak.cold .row1{color:var(--muted)}
.streak.cold .flame{filter:grayscale(1);opacity:.5}
.hero-goal{margin-top:12px;font-size:13px;color:#9be7f7}
.hero-goal b{color:#fff}
.sk-body{background:radial-gradient(120% 50% at 50% 0%,rgba(34,211,238,.22),transparent 70%)}
.sk-hero{position:relative;text-align:center;padding:10px 0 18px}
.sk-glow{position:absolute;left:50%;top:70px;width:300px;height:300px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(34,211,238,.35),transparent 65%);animation:breathe2 3.5s ease-in-out infinite;pointer-events:none}
@keyframes breathe2{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.8}}
.sk-hero .flame{width:74px;height:96px;position:relative}
.sk-num{position:relative;font-family:"Kaushan Script",cursive;font-size:110px;line-height:1;margin-top:-6px;padding:0 10px 10px;
  background:linear-gradient(100deg,#ffffff,#38bdf8 50%,#e6fbff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(34,211,238,.45))}
.sk-lbl{position:relative;font-family:Archivo;font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase;margin-top:-8px}
.sk-sub{position:relative;color:#9be7f7;font-size:14px;margin-top:8px}
.sk-grid{display:flex;gap:10px}
.sk-stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk-stats3 div{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.sk-stats3 b{display:block;font-family:Archivo;font-size:26px}
.sk-stats3 span{font-size:12px;color:var(--muted)}
.sk-ring{position:relative;width:132px;flex:none;background:var(--card);border-radius:18px;padding:12px;text-align:center}
.sk-ring svg{width:100px;height:100px}
.sk-ring b{position:absolute;left:0;right:0;top:46px;font-family:Archivo;font-size:22px}
.sk-ring span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sk-stats{flex:1;display:grid;gap:10px}
.sk-stats div{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.sk-stats b{font-family:Archivo;font-size:26px}
.sk-stats span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;opacity:.38;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:linear-gradient(160deg,rgba(34,211,238,.2),var(--card) 70%);border:1px solid rgba(103,232,249,.2)}
.badge i{font-style:normal;font-size:24px;display:block}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:10px;color:var(--muted)}
.goalseg button{flex:1;min-width:44px}
.imgov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 20px)}
.imgov img{max-height:68vh;max-width:100%;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.imgov p{color:#9be7f7;font-size:14px;text-align:center;margin:0}
.celebrate{position:fixed;inset:0;z-index:300;background:rgba(10,8,6,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease;overflow:hidden}

@keyframes fadeIn{from{opacity:0}}

@keyframes pop{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-100vh);opacity:0}}
.cb{position:relative;text-align:center;max-width:320px;width:100%;animation:popIn .5s cubic-bezier(.2,1.4,.4,1)}

.cb .flame{width:90px;height:116px}

.upd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(100deg,rgba(34,211,238,.18),rgba(230,251,255,.12));border:1px solid rgba(103,232,249,.35);color:#e8f9ff;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}

/* welcome */
@font-face{font-family:"Kaushan Script";src:url(kaushan-script.woff2) format("woff2");font-display:swap}
#welcome{position:fixed;inset:0;z-index:200;overflow:hidden;background:#07080a;color:#fff;transition:opacity .6s ease,transform .6s ease}

.wl-swipe{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 0 2px;color:#e8f9ff;font-weight:600;font-size:14px;letter-spacing:.4px}

  background:radial-gradient(120% 70% at 85% 0%,rgba(34,211,238,.44),transparent 60%),
             radial-gradient(90% 60% at 0% 100%,rgba(200,255,46,.16),transparent 60%),
             linear-gradient(180deg,#05141a 0%,#0d0e11 72%)}
#welcome.lit .wl-bg{opacity:1}
.wl-glow{position:absolute;width:440px;height:440px;border-radius:50%;left:50%;top:36%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%);opacity:0;pointer-events:none}
#welcome.lit .wl-glow{animation:breathe 5s 1s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}}
.wl-burst{position:absolute;left:50%;top:44%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  background:radial-gradient(circle,rgba(186,246,255,.95),rgba(6,182,212,.4) 40%,transparent 70%);transform:scale(0);opacity:0;pointer-events:none}
#welcome.lit .wl-burst{animation:burst 1.5s cubic-bezier(.15,.7,.2,1) forwards}
@keyframes burst{0%{transform:scale(0);opacity:1}100%{transform:scale(45);opacity:0}}
.wl-logo{position:absolute;left:50%;top:44%;width:120px;height:120px;transform:translate(-50%,-50%);color:#22d3ee;
  filter:drop-shadow(0 0 16px rgba(34,211,238,.75));animation:pulse 1.1s .9s ease-in-out}
.wl-logo path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .8s .2s cubic-bezier(.6,0,.3,1) forwards}
.wl-logo path:nth-child(2){animation-delay:.35s}.wl-logo path:nth-child(3){animation-delay:.5s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 0 30px rgba(34,211,238,1))}}
#welcome.lit .wl-logo{animation:logoOut .7s .25s ease forwards}
.wl-mono{position:absolute;left:50%;top:calc(44% + 64px);transform:translateX(-50%);font-family:"Kaushan Script",cursive;font-size:46px;line-height:1.2;padding:0 10px 8px 6px;white-space:nowrap;
  background:linear-gradient(100deg,#ffffff,#38bdf8 50%,#e6fbff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(34,211,238,.55));clip-path:inset(-30% 100% -30% 0);animation:write .7s .75s cubic-bezier(.45,.05,.3,1) forwards;pointer-events:none}
#welcome.lit .wl-mono{clip-path:inset(-30% -5% -30% 0);animation:monoOut .7s .25s ease forwards}
@keyframes monoOut{to{opacity:0;transform:translate(-50%,-70px) scale(.6)}}
@keyframes logoOut{to{opacity:0;transform:translate(-50%,-120%) scale(.55)}}
.ember{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:#7fe7fb;box-shadow:0 0 8px 2px rgba(34,211,238,.6);opacity:0;pointer-events:none}
#welcome.lit .ember{animation:ember linear infinite}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}10%{opacity:.9}80%{opacity:.5}100%{opacity:0;transform:translate(var(--dx),-105vh)}}
.wl-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 40px) 28px calc(var(--sab) + 32px)}
.wl-top{display:flex;align-items:center;justify-content:space-between;opacity:0}
.wl-date{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(165,243,252,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wl-day{width:52px;height:56px;border-radius:14px;background:linear-gradient(160deg,#22d3ee,#e6fbff);color:#00151b;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(34,211,238,.35)}
.wl-day small{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.75;line-height:1}
.wl-day b{font-family:Archivo,Inter,sans-serif;font-size:26px;font-weight:800;line-height:1.05}
.wl-dtxt b{display:block;font-family:"Kaushan Script",cursive;font-weight:400;font-size:24px;line-height:1.15;color:#e8f9ff}
.wl-dtxt span{font-size:13px;color:rgba(230,249,255,.6);font-weight:500}
.wl-wk{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#9be7f7;padding:7px 11px;border-radius:999px;background:rgba(34,211,238,.12);border:1px solid rgba(103,232,249,.2)}
.wl-greet{font-family:Archivo,Inter,sans-serif;font-size:26px;font-weight:700;color:#e8f9ff;opacity:0}
.wl-name-wrap{filter:drop-shadow(0 6px 26px rgba(34,211,238,.38))}
.wl-name{font-family:"Kaushan Script",cursive;font-size:clamp(68px,20vw,104px);line-height:1.05;margin:0 0 -12px -4px;padding:4px 8px 24px 4px;
  background:linear-gradient(100deg,#ffffff 0%,#38bdf8 45%,#e6fbff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  word-break:break-word;clip-path:inset(-20% 100% -20% 0)}
.wl-quote{position:relative;font-size:19px;line-height:1.5;color:#f4fdff;max-width:350px;margin-top:22px;padding-left:2px;opacity:0}
.wl-quote .qm{font-family:"Kaushan Script",cursive;font-size:64px;line-height:0;color:#38bdf8;position:relative;top:24px;margin-right:8px;opacity:.9;display:inline-block}
.wl-bottom{opacity:0}
#welcome.show .wl-top{animation:rise .8s ease forwards}
#welcome.show .wl-greet{animation:rise .8s .1s ease forwards}
#welcome.show .wl-name{animation:write 1.5s .35s cubic-bezier(.45,.05,.3,1) forwards}
#welcome.show .wl-quote{animation:rise 1s 1.5s ease forwards}
#welcome.show .wl-bottom{animation:rise .9s 2s ease forwards}
@keyframes write{to{clip-path:inset(-20% -5% -20% 0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#welcome.skip *,#welcome.skip{animation-delay:0s!important;animation-duration:.25s!important}
#welcome.skip .wl-glow{animation:none!important;opacity:.8}
#welcome.skip .ember{animation-duration:9s!important}
.wl-stats{display:flex;gap:10px;margin-bottom:18px}
.wl-stat{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px}
.wl-stat b{display:block;font-family:Archivo;font-size:22px;color:#fff}
.wl-stat span{font-size:12px;color:rgba(230,249,255,.65)}
.wl-go{width:100%;padding:17px;border-radius:18px;font-weight:800;font-size:17px;color:#00151b;
  background:linear-gradient(100deg,#22d3ee,#e6fbff);box-shadow:0 10px 30px rgba(34,211,238,.3)}
.wl-go:active{transform:scale(.98)}
.wl-ask{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px calc(var(--sab) + 40px)}
.wl-ask h2{font-family:Archivo;font-size:30px;line-height:1.2;color:#f4fdff;margin-bottom:10px}
.wl-ask p{color:rgba(230,249,255,.7);margin:0 0 22px;font-size:16px;line-height:1.5}
.wl-ask input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:22px;padding:16px;border-radius:16px;margin-bottom:12px;text-align:center}
.wl-ask input:focus{border-color:#38bdf8}
@media (prefers-reduced-motion:reduce){#welcome *{animation:none!important;transition:none!important}
  #welcome .wl-top,#welcome .wl-greet,#welcome .wl-quote,#welcome .wl-bottom{opacity:1}#welcome .wl-name{clip-path:none}#welcome .wl-logo,#welcome .wl-mono{display:none}}

/* ===== brede opmaak (laptop / desktop) ===== */
@media (min-width:900px){
  :root{--side:236px}
  nav.tabs{top:0;bottom:0;left:0;right:auto;width:var(--side);padding:28px 16px;flex-direction:column;justify-content:flex-start;background:rgba(10,12,15,.96);border-right:1px solid var(--line)}
  nav.tabs::before{content:"Gym";display:block;font-family:"Kaushan Script",cursive;font-size:38px;line-height:1.2;padding:0 8px 18px;background:linear-gradient(100deg,#ffffff,#38bdf8 50%,#e6fbff);-webkit-background-clip:text;background-clip:text;color:transparent}
  nav.tabs .in{flex-direction:column;gap:8px;max-width:none}
  nav.tabs button{flex:none!important;height:52px;justify-content:flex-start;padding:0 16px;gap:12px!important;border-radius:14px}
  nav.tabs button span{max-width:none;opacity:1;font-size:15px}
  nav.tabs button:not(.on){background:transparent;border-color:transparent}
  nav.tabs button:not(.on):hover{background:rgba(255,255,255,.05)}
  .app{max-width:none;margin:0 0 0 var(--side);padding:34px 48px 60px;column-count:2;column-gap:28px;column-fill:balance}
  @media (min-width:1500px){.app{column-count:3}}
  .app>*{break-inside:avoid}
  .app>header.top,.app>.banner,.app>.upd,.app>.chips,.app>.daynav,.app>.empty,.app>.mbtns,.app>.field:has(#progSel),.app>.seg{column-span:all}
  .section-label{break-after:avoid}
  .wt-row{margin:0;padding:2px 0 6px}
  .mtiles{grid-template-columns:repeat(4,1fr)}
  .hero,.card,.stat,.meal,.water,.list,.hist,.chart,.recs,.prog,.today,.goalrow{margin-bottom:12px}
  .stats{margin-bottom:12px}
  .btn.primary.block.big{margin-bottom:12px}
  header.top h1{font-size:56px}
  .fab{right:40px;bottom:40px}
  .toast{bottom:40px;left:calc(50% + var(--side)/2)}
  #macroPill{left:calc(var(--side) + 40px);right:40px;max-width:640px}
  .sheet-wrap{background:rgba(0,0,0,.6)}
  .sheet{top:4vh;bottom:4vh;left:calc(var(--side) + 40px);right:40px;max-width:720px;margin:0 auto;border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6);border:1px solid var(--line)}
  .pk{top:4vh;bottom:4vh;left:calc(var(--side) + 40px);right:40px;max-width:900px;border-radius:22px}
  .pk-grid{grid-template-columns:repeat(4,1fr)}
  .wl-content{max-width:640px;margin:0 auto;left:0;right:0}
  #scanner .sc-frame{left:30%;right:30%}
  .celebrate .cb{max-width:380px}
  input,select,textarea{font-size:15px}
  button:hover{filter:brightness(1.08)}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:10px}
}
</style>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const toD=s=>new Date(s+"T12:00:00");
const fmtDate=(s,opt)=>s?toD(s).toLocaleDateString("nl-NL",opt||{weekday:"short",day:"numeric",month:"short"}):"";
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(n)?n:0};
const fmtKg=n=>(Math.round(n*10)/10).toLocaleString("nl-NL");
const e1rm=(kg,r)=>r>0&&kg>0?kg*(1+r/30):0;
const norm=s=>String(s||"").trim().toLowerCase();
const clone=o=>JSON.parse(JSON.stringify(o));
const daysAgo=s=>Math.round((toD(today())-toD(s))/864e5);

const ICON={
  train:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>',

const LKEY="gym_app_v1";
const Store={
  base:null,
  async init(){
    S.mode="local";this.loadLocal();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    render();
  },
  sub(kind){
    let done=false;
    const timer=setTimeout(()=>{if(!done){S.slow=true;render()}},10000);
    this.base.collection(kind).onSnapshot(snap=>{
      S[kind]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      if(!snap.metadata.fromCache){done=true;clearTimeout(timer);S.slow=false}
      render();
    },err=>{done=true;clearTimeout(timer);S.err="Gegevens konden niet geladen worden ("+(err&&err.code||"fout")+").";render()});
  },
  loadLocal(){
    try{const d=JSON.parse(localStorage.getItem(LKEY)||"{}");S.workouts=d.workouts||[];S.content=d.content||[];S.food=d.food||[];S.measure=d.measure||[]}catch(e){}
  },
  persist(){
    try{localStorage.setItem(LKEY,JSON.stringify({workouts:S.workouts,content:S.content,food:S.food,measure:S.measure}))}catch(e){}
  },
  async save(kind,obj){DATAV++;
    obj=clone(obj);obj.u=Date.now();const id=obj.id;delete obj.id;
    if(S.mode==="cloud"){
      try{await this.base.collection(kind).doc(id).set(obj)}
      catch(e){
        if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));await this.base.collection(kind).doc(id).set(obj);return}
        throw e;
      }
    }else{
      obj.id=id;const arr=S[kind];const i=arr.findIndex(x=>x.id===id);
      if(i>=0)arr[i]=obj;else arr.push(obj);this.persist();render();scheduleSync();
    }
  },
  async remove(kind,id){DATAV++;
    if(S.mode==="cloud"){await this.base.collection(kind).doc(id).delete()}
    else{S[kind]=S[kind].filter(x=>x.id!==id);markDel(kind,id);this.persist();render();scheduleSync()}
  }
};

async function exportBackup(){
  const data={app:"gym",version:1,exportedAt:new Date().toISOString(),workouts:S.workouts,content:S.content,food:S.food,measure:S.measure,foodGoals:getFoodGoals(),macroTemplates:getTpls(),workoutTemplates:getWT(),water:(()=>{try{return JSON.parse(lsGet(WAKEY)||"{}")}catch(e){return {}}})(),waterLog:waterLogAll()};
  const name="gym-backup-"+today()+".json";

  let done=false;
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done=true}
  }catch(e){if(e&&e.name==="AbortError")return}
  if(!done){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
  try{localStorage.setItem(BKEY,String(Date.now()))}catch(e){}

function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.content))throw 0;
      let added=0;
      if(d.foodGoals&&!lsGet(FGKEY))lsSet(FGKEY,JSON.stringify(d.foodGoals));
      if(d.macroTemplates&&!lsGet(TKEY))lsSet(TKEY,JSON.stringify(d.macroTemplates));
      if(Array.isArray(d.workoutTemplates)){const cur=getWT();for(const t of d.workoutTemplates)if(t&&t.id&&!cur.some(x=>x.id===t.id))cur.push(t);saveWT(cur)}
      if(d.waterLog&&typeof d.waterLog==="object"){const cur=waterLogAll();for(const k in d.waterLog)if(!cur[k]&&Array.isArray(d.waterLog[k]))cur[k]=d.waterLog[k];lsSet(WLKEY,JSON.stringify(cur));waterLog.cache=null}
      if(d.water&&typeof d.water==="object"){let m={};try{m=JSON.parse(lsGet(WAKEY)||"{}")}catch(e){}lsSet(WAKEY,JSON.stringify(Object.assign({},d.water,m)))}
      for(const kind of ["workouts","content","food","measure"])for(const item of (d[kind]||[])){
        if(!item||typeof item!=="object"||!item.id)continue;
        const i=S[kind].findIndex(x=>x.id===item.id);
        if(i>=0)S[kind][i]=item;else{S[kind].push(item);added++}
      }
      Store.persist();DATAV++;scheduleSync();render();if(S.sheet==="settings")renderSheet();
      toast("Backup teruggezet ("+added+" nieuw)");
    }catch(e){toast("Dit is geen geldig backup-bestand")}
  };
  r.readAsText(file);
}

function nextQuote(){
  let st={};try{st=JSON.parse(lsGet(QKEY)||"{}")||{}}catch(e){}
  const n=QUOTES.length;
  if(!Array.isArray(st.order)||st.order.length!==n||!(st.i<n)){
    const last=Array.isArray(st.order)&&st.i>0?st.order[st.i-1]:-1;
    const o=[...Array(n).keys()];
    for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
    if(o[0]===last)[o[0],o[n-1]]=[o[n-1],o[0]];
    st={order:o,i:0};
  }
  const q=QUOTES[st.order[st.i]];st.i++;lsSet(QKEY,JSON.stringify(st));return q;
}

function hideWelcome(){const el=$("#welcome");wlTimers.forEach(clearTimeout);el.style.transform="";el.classList.remove("dragging","snap");el.classList.add("out-up");document.body.classList.remove("lock");setTimeout(()=>{el.style.display="none";el.innerHTML=""},620)}
(function(){
  const el=$("#welcome");let y0=null,t0=0,dy=0,moved=false,pid=null;
  el.addEventListener("click",ev=>{if(moved){moved=false;ev.stopPropagation();ev.preventDefault();return}
    if(!ev.target.closest(".wl-go,.wl-swipe,form")&&!el.classList.contains("show"))skipIntro()},true);
  el.addEventListener("pointerdown",ev=>{
    if(ev.target.closest("form")||!el.classList.contains("show")||el.classList.contains("out-up"))return;
    y0=ev.clientY;t0=performance.now();dy=0;moved=false;pid=ev.pointerId;el.classList.remove("snap");el.classList.add("dragging");
  });
  el.addEventListener("pointermove",ev=>{
    if(y0==null)return;dy=ev.clientY-y0;if(Math.abs(dy)>6&&!moved){moved=true;try{el.setPointerCapture(pid)}catch(e){}}
    const d=dy<0?dy:dy*0.25;el.style.transform="translateY("+d+"px)";
  });
  const end=()=>{
    if(y0==null)return;const v=dy/Math.max(1,performance.now()-t0);y0=null;el.classList.remove("dragging");
    if(dy<-innerHeight*0.22||(dy<-60&&v<-0.6))hideWelcome();
    else{el.classList.add("snap");el.style.transform="";}
  };
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
})();

const MILESTONES=[[1,"Eerste dag","🌱"],[10,"Op gang","⚡"],[25,"Vaste prik","💪"],[50,"Halve eeuw","🔥"],[100,"Honderd!","🏅"],[150,"Machine","🚀"],[250,"Beest","🏆"],[365,"Een jaar vol","👑"]];
function dayInfo(){
  const t=today(),dates=new Set(S.workouts.filter(w=>w.date&&w.date<=t).map(w=>w.date));
  const monS=weekStart(new Date()),mo=t.slice(0,7),yr=t.slice(0,4);
  let week=0,month=0,year=0;for(const d of dates){if(d>=monS)week++;if(d.startsWith(mo))month++;if(d.startsWith(yr))year++}
  const total=dates.size,next=MILESTONES.find(m=>m[0]>total);
  return {total,week,month,year,next};
}

const APP_VERSION="2.1.1";
async function checkUpdate(manual){
  if(location.protocol!=="https:"||location.hostname.endsWith("claude.ai")||location.hostname.includes("claudeusercontent")){if(manual)toast("Updates werken in de app op je beginscherm");return}
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
    const v=await r.json();
    if(v&&v.version&&v.version!==APP_VERSION){S.update=v;render();if(S.sheet==="settings")renderSheet();if(manual)toast("Nieuwe versie gevonden ✨")}
    else if(manual)toast("Je hebt de nieuwste versie ✓");
  }catch(e){if(manual)toast("Geen internet, probeer later opnieuw")}
}
async function doUpdate(){
  toast("Updaten…");
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
  location.reload();
}

  await loadTess();

const SYNC_KEYS=["gym_name","gym_welcome_off","gym_wtpl","gym_ex_goals","gym_body_goal","gym_meas_goals","gym_macro_tpl","gym_food_goals","gym_water_log","gym_barcodes"];
const SKT="gym_sync_token",SKG="gym_sync_gist",SKL="gym_sync_login",SKD="gym_deleted",SKU="gym_kvu",SKLAST="gym_sync_last";
const KINDS=["workouts","content","food","measure"];
const SFILE="gym-data.json",SDESC="Gym app sync (privé, niet bewerken)";
const SY={state:"off",msg:"",busy:false,again:false,t:null};
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const syncOn=()=>!!(lsGet(SKT)&&lsGet(SKG));
function markKV(k){if(!SYNC_KEYS.includes(k))return;const u=jget(SKU,{});u[k]=Date.now();jset(SKU,u);scheduleSync()}
function markDel(kind,id){const d=jget(SKD,{});(d[kind]=d[kind]||{})[id]=Date.now();jset(SKD,d)}
const itemT=x=>num(x&&(x.u||x.createdAt))||0;
function setSyncState(st,msg){SY.state=st;SY.msg=msg||"";document.body.dataset.sync=syncOn()?st:"off";if(S.sheet==="settings"){const el=$("#syncStat");if(el)el.innerHTML=syncStatHTML()}}
function syncStatHTML(){const t=num(lsGet(SKLAST));
  return SY.state==="busy"?'<i class="spin"></i> Bezig met synchroniseren…':SY.state==="err"?'⚠️ '+esc(SY.msg||"Synchroniseren mislukt"):
    '✓ Gesynchroniseerd'+(t?' · '+new Date(t).toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):'')}
function localPayload(){
  const kv={},kvu=jget(SKU,{});
  for(const k of SYNC_KEYS){let v=null;try{v=localStorage.getItem(k)}catch(e){}kv[k]={v,u:kvu[k]||0}}
  const data={};for(const k of KINDS)data[k]=S[k];
  return {v:1,data,del:jget(SKD,{}),kv};
}
function mergeRemote(r){
  let changed=false;if(!r||!r.data)return false;
  const del=jget(SKD,{});
  for(const kind of KINDS){const rd=r.del&&r.del[kind]||{};del[kind]=del[kind]||{};for(const id in rd)if(!(del[kind][id]>=rd[id])){del[kind][id]=rd[id]}}
  jset(SKD,del);
  for(const kind of KINDS){
    const m=new Map(S[kind].map(x=>[x.id,x]));
    for(const x of (r.data[kind]||[])){if(!x||!x.id)continue;const l=m.get(x.id);if(!l||itemT(x)>itemT(l)){m.set(x.id,x);changed=true}}
    const dk=del[kind]||{};const out=[];for(const x of m.values()){if(dk[x.id]&&dk[x.id]>=itemT(x)){if(S[kind].some(y=>y.id===x.id))changed=true;continue}out.push(x)}
    S[kind]=out;
  }
  const kvu=jget(SKU,{});
  for(const k in (r.kv||{})){if(!SYNC_KEYS.includes(k))continue;const e=r.kv[k];if(e&&e.u>(kvu[k]||0)){try{e.v==null?localStorage.removeItem(k):localStorage.setItem(k,e.v)}catch(er){}kvu[k]=e.u;changed=true}}
  jset(SKU,kvu);
  if(changed){Store.persist();DATAV++;try{waterLog.cache=null}catch(e){}}
  return changed;
}
async function gh(path,opt){
  opt=opt||{};const r=await fetch("https://api.github.com"+path,Object.assign({},opt,{cache:"no-store",headers:Object.assign({"Authorization":"Bearer "+lsGet(SKT),"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.body?{"Content-Type":"application/json"}:{})}));
  if(r.status===401)throw new Error("Sleutel ongeldig of verlopen");
  if(r.status===404)throw new Error("Sync-bestand niet gevonden");
  if(!r.ok)throw new Error("GitHub-fout "+r.status);
  return r.status===204?null:r.json();
}
async function readGist(){
  const g=await gh("/gists/"+lsGet(SKG));const f=g.files&&g.files[SFILE];if(!f)return null;
  let txt=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:"no-store"});txt=await r.text()}

async function syncNow(manual){
  if(!syncOn())return;
  if(SY.busy){SY.again=true;return}
  if(!navigator.onLine){setSyncState("err","Geen internet, synct later vanzelf");return}
  SY.busy=true;setSyncState("busy");
  try{
    const remote=await readGist();
    const changed=mergeRemote(remote);
    if(changed&&!S.sheet)render();
    const mine=JSON.stringify(localPayload()),theirs=remote?JSON.stringify({v:remote.v,data:remote.data,del:remote.del,kv:remote.kv}):"";
    if(mine!==theirs)await gh("/gists/"+lsGet(SKG),{method:"PATCH",body:JSON.stringify({files:{[SFILE]:{content:mine}}})});
    lsSet(SKLAST,String(Date.now()));setSyncState("ok");if(manual)toast(changed?"Gesynchroniseerd, nieuwe gegevens binnengehaald ✓":"Alles is gesynchroniseerd ✓");
  }catch(e){setSyncState("err",e.message||"mislukt");if(manual)toast(e.message||"Synchroniseren mislukt")}
  finally{SY.busy=false;if(SY.again){SY.again=false;scheduleSync(800)}}
}
function scheduleSync(ms){if(!syncOn())return;clearTimeout(SY.t);SY.t=setTimeout(()=>syncNow(false),ms==null?2500:ms)}
async function connectSync(tok){

const sortedWorkouts=()=>S.workouts.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));
function exerciseIndex(){
  const m=new Map();
  for(const w of S.workouts)for(const ex of (w.exercises||[])){
    const k=norm(ex.name);if(!k)continue;
    if(!(ex.sets||[]).some(st=>num(st.kg)||num(st.reps)))continue;
    if(!m.has(k))m.set(k,{name:ex.name.trim(),count:0});
    m.get(k).count++;
  }
  return [...m.values()].sort((a,b)=>b.count-a.count);
}
function lastTimeFor(name,excludeId,beforeDate){
  const k=norm(name);if(!k)return null;
  for(const w of sortedWorkouts()){
    if(w.id===excludeId)continue;
    if(beforeDate&&w.date>beforeDate)continue;
    const ex=(w.exercises||[]).find(e=>norm(e.name)===k);
    if(ex&&ex.sets&&ex.sets.some(s=>num(s.kg)||num(s.reps)))return{w,ex};
  }
  return null;
}
function lastWorkoutNamed(name,excludeId){
  const k=norm(name);if(!k)return null;

function volume(w){let v=0;for(const ex of w.exercises||[])for(const s of ex.sets||[])v+=num(s.kg)*num(s.reps);return v}

function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)}
function streakWeeks(){
  const set=new Set(S.workouts.filter(w=>w.date&&w.date<=today()).map(w=>weekStart(toD(w.date))));
  let d=toD(weekStart(new Date()));let n=0;
  if(!set.has(iso(d)))d.setDate(d.getDate()-7);
  while(set.has(iso(d))){n++;d.setDate(d.getDate()-7)}
  return n;
}
function recentPRs(){
  const by=new Map();
  for(const w of S.workouts)for(const ex of w.exercises||[]){
    const k=norm(ex.name);if(!k)continue;const mx=Math.max(0,...(ex.sets||[]).map(s=>num(s.kg)));if(!mx)continue;
    if(!by.has(k))by.set(k,[]);by.get(k).push({name:ex.name.trim(),date:w.date,max:mx});
  }
  const out=[];const lim=iso(new Date(Date.now()-30*864e5));
  for(const arr of by.values()){
    arr.sort((a,b)=>a.date.localeCompare(b.date));let best=0;
    arr.forEach((s,i)=>{if(i>0&&s.max>best&&s.date>=lim)out.push({name:s.name,date:s.date,max:s.max,diff:s.max-best});best=Math.max(best,s.max)});
  }
  return out.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
}

      '<div class="dblock"><b>'+d.getDate()+'</b><span>'+esc(d.toLocaleDateString("nl-NL",{weekday:"short"}))+'</span></div>'+
      '<div class="wbody"><div class="row between"><span class="w-name" style="margin:0">'+esc(w.name||"Training")+(()=>{const im=impFor(w),pr=im.filter(x=>x.pr).length;return im.length?' <em class="impb'+(pr?' pr':'')+'">'+(pr?'🏆 '+pr:'↑ '+im.length)+'</em>':''})()+'</span><span class="meta">'+setCount(w)+(setCount(w)===1?' set':' sets')+' · '+kShort(volume(w))+' kg</span></div>'+
      '<div class="chipsx">'+(chips||'<span class="muted small">Geen oefeningen</span>')+'</div></div></button>';
  }
  if(ws.length>lim)h+='<button class="btn block" data-act="histMore">Toon meer ('+(ws.length-lim)+')</button>';
  return h;
}

/* ---------- doelen & progressie-signalen ---------- */
const EGKEY="gym_ex_goals",BGKEY="gym_body_goal";
const exGoals=()=>{try{return JSON.parse(lsGet(EGKEY)||"{}")||{}}catch(e){return {}}};
const exGoal=n=>num(exGoals()[norm(n)])||0;
function setExGoal(n,v){const g=exGoals(),k=norm(n);v=num(v);if(v>0)g[k]=Math.round(v*100)/100;else delete g[k];lsSet(EGKEY,JSON.stringify(g))}
const bodyGoal=()=>num(lsGet(BGKEY))||0;
const MGKEY="gym_meas_goals";
function mGoal(k){if(k==="weight")return bodyGoal();try{return num((JSON.parse(lsGet(MGKEY)||"{}")||{})[k])||0}catch(e){return 0}}
function setMGoal(k,v){v=num(v);if(k==="weight"){lsSet(BGKEY,v>0?String(v):"");return}let g={};try{g=JSON.parse(lsGet(MGKEY)||"{}")||{}}catch(e){}if(v>0)g[k]=v;else delete g[k];lsSet(MGKEY,JSON.stringify(g))}
function exStats(ex){let max=0,best=0;for(const s of ex.sets||[]){const kg=num(s.kg),r=num(s.reps);if(kg>max)max=kg;const e=e1rm(kg,r)||(kg?0:r/1000);if(e>best)best=e}return {max,best}}
function allTimeBefore(name,excludeId,date){let max=0,best=0;const k=norm(name);
  for(const w of S.workouts){if(w.id===excludeId||w.date>date)continue;for(const ex of w.exercises||[])if(norm(ex.name)===k){const st=exStats(ex);if(st.max>max)max=st.max;if(st.best>best)best=st.best}}
  return {max,best}}
function setVerdict(name,exId,date,j,kg,reps,prev,atb){
  kg=num(kg);reps=num(reps);if(!reps)return "";
  if(kg>0&&atb.best>0&&e1rm(kg,reps)>atb.best+.01)return "pr";
  const p=prev&&prev.ex.sets[j];if(!p)return "";
  const pk=num(p.kg),pr=num(p.reps);
  if(kg>pk+.001&&reps>=Math.max(1,pr-2))return "up";
  if(Math.abs(kg-pk)<.001&&reps>pr)return "up";
  return "";
}
let IMPV=-1,IMPM=new Map();
function impFor(w){if(IMPV!==DATAV){IMPV=DATAV;IMPM=new Map()}let r=IMPM.get(w.id);if(!r){r=improvements(w);IMPM.set(w.id,r)}return r}
function improvements(w){
  const out=[];
  for(const ex of w.exercises||[]){
    const prev=lastTimeFor(ex.name,w.id,w.date);if(!prev)continue;
    const cur=exStats(ex),pst=exStats(prev.ex),atb=allTimeBefore(ex.name,w.id,w.date);
    if(cur.best<=pst.best+.01)continue;
    let txt;
    if(cur.max>pst.max+.001)txt="+"+fmtKg(cur.max-pst.max)+" kg";
    else{const bp=Math.max(0,...(prev.ex.sets||[]).filter(s=>num(s.kg)===cur.max).map(s=>num(s.reps))),bc=Math.max(0,...(ex.sets||[]).filter(s=>num(s.kg)===cur.max).map(s=>num(s.reps)));txt=bc>bp?"+"+(bc-bp)+" reps":"sterker"}
    out.push({name:ex.name,txt,pr:cur.best>atb.best+.01&&cur.max>0});
  }
  return out;
}
function refreshSetBadges(i){
  const d=S.draft;if(!d||S.sheet!=="workout")return;const ex=d.exercises[i];if(!ex)return;
  const prev=lastTimeFor(ex.name,d.id,d.date),atb=allTimeBefore(ex.name,d.id,d.date),rows=document.querySelectorAll('#sheet .ex')[i];if(!rows)return;
  let ups=0,prs=0;
  rows.querySelectorAll(".set").forEach((row,j)=>{const s=ex.sets[j];if(!s)return;const v=setVerdict(ex.name,ex.exId,d.date,j,s.kg,s.reps,prev,atb);
    row.classList.toggle("up",v==="up");row.classList.toggle("pr",v==="pr");const no=row.querySelector(".no");if(no)no.textContent=v==="pr"?"🏆":v==="up"?"↑":String(j+1);
    if(v==="up")ups++;if(v==="pr")prs++});
  const tag=rows.querySelector(".exprog");if(tag){tag.innerHTML=prs?'🏆 Nieuw record!':ups?'↑ Beter dan vorige keer ('+ups+(ups===1?' set':' sets')+')':'';tag.style.display=prs||ups?"":"none"}
}

function viewProg(){
  let h='<header class="top"><div><h1>Progressie</h1><div class="sub">Per oefening, over tijd</div></div>'+GEAR+'</header>';
  const idx=exerciseIndex();
  if(!idx.length)return h+'<div class="empty"><div class="big">📈</div>Log eerst een paar trainingen, dan zie je hier je progressie per oefening.</div>';
  if(!S.progEx||!idx.some(e=>norm(e.name)===norm(S.progEx)))S.progEx=idx[0].name;
  h+='<div class="field"><select id="progSel">'+idx.map(e=>'<option value="'+esc(e.name)+'"'+(norm(e.name)===norm(S.progEx)?" selected":"")+'>'+esc(e.name)+' ('+e.count+'×)</option>').join("")+'</select></div>';
  const k=norm(S.progEx);
  const sess=[];
  for(const w of S.workouts){
    for(const ex of w.exercises||[]){
      if(norm(ex.name)!==k)continue;
      const sets=(ex.sets||[]).filter(s=>num(s.kg)||num(s.reps));
      if(!sets.length)continue;
      let max=0,best=0,bestSet=null,vol=0;
      for(const s of sets){const kg=num(s.kg),r=num(s.reps);vol+=kg*r;if(kg>max)max=kg;const e=e1rm(kg,r);if(e>best){best=e;bestSet=s}}
      sess.push({date:w.date,sets,max,best,bestSet,vol});
    }
  }
  sess.sort((a,b)=>a.date.localeCompare(b.date));
  if(!sess.length)return h+'<div class="empty">Nog geen ingevulde sets voor deze oefening.</div>';
  const metrics=[["max","Max gewicht"],["e1rm","Geschat 1RM"],["vol","Volume"]];
  h+='<div class="seg" style="margin-bottom:10px">'+metrics.map(([k2,l])=>'<button data-metric="'+k2+'" class="'+(S.metric===k2?"on":"")+'">'+l+'</button>').join("")+'</div>';
  const key=S.metric==="max"?"max":S.metric==="e1rm"?"best":"vol";
  const goal=exGoal(S.progEx),curMax=Math.max(...sess.map(s=>s.max));
  h+='<div class="goalrow"><span>🎯 Doel</span><input data-exgoal="'+esc(S.progEx)+'" inputmode="decimal" placeholder="bv. 100" value="'+(goal||"")+'"><span class="muted">kg</span>'+
     (goal?'<b class="'+(curMax>=goal?"done":"")+'">'+(curMax>=goal?"✓ Behaald!":"nog "+fmtKg(goal-curMax)+" kg")+'</b>':'<span class="small muted">vul je streefgewicht in</span>')+'</div>';
  if(goal)h+='<div class="goalbar"><i style="width:'+Math.min(100,curMax/goal*100).toFixed(1)+'%"></i></div>';
  h+='<div class="chart">'+chartSvg(sess.map(s=>({d:s.date,v:s[key]})),key==="vol"?0:goal,{prs:true})+'</div><div class="small muted" style="margin:-4px 2px 10px">Witte ring = nieuw record · rode stippellijn = je doel</div>';
  let prMax=null,prE=null;
  for(const s of sess){if(!prMax||s.max>prMax.max)prMax=s;if(!prE||s.best>prE.best)prE=s}
  const first=sess[0],lastS=sess[sess.length-1];
  const diff=lastS&&first?lastS.max-first.max:0;
  h+='<div class="recs">'+
    '<div class="rec"><b>'+fmtKg(prMax.max)+' kg</b><span>PR gewicht · '+esc(fmtDate(prMax.date,{day:"numeric",month:"short"}))+'</span></div>'+
    '<div class="rec"><b>'+fmtKg(prE.best)+' kg</b><span>Beste geschat 1RM</span></div>'+
    '<div class="rec"><b>'+sess.length+'</b><span>sessies gelogd</span></div>'+
    '<div class="rec"><b>'+(diff>=0?"+":"")+fmtKg(diff)+' kg</b><span>sinds eerste sessie</span></div></div>';
  h+='<div class="section-label">Geschiedenis</div><div class="hist">'+sess.slice().reverse().map(s=>'<div><span class="muted">'+esc(fmtDate(s.date,{day:"numeric",month:"short",year:"2-digit"}))+'</span><span>'+esc(setsStr(s.sets))+'</span></div>').join("")+'</div>';
  return h;
}

function chartSvg(pts,goal,opt){
  opt=opt||{};const W=340,H=170,pl=36,pr=12,pt=14,pb=26;
  if(!pts.length)return "";
  const vs=pts.map(p=>p.v).concat(goal>0?[goal]:[]);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi===lo){hi+=1;lo=Math.max(0,lo-1)}
  const padV=(hi-lo)*.12;lo=Math.max(0,lo-padV);hi+=padV;
  const x=i=>pts.length===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g="";
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const yy=y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2a2e37" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" fill="#8b919c" font-size="10" text-anchor="end">'+Math.round(v)+'</text>'}
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=d+" L"+x(pts.length-1).toFixed(1)+" "+(H-pb)+" L"+x(0).toFixed(1)+" "+(H-pb)+" Z";
  let run=-Infinity;const dots=pts.map((p,i)=>{const isPr=opt.prs&&i>0&&p.v>run+.001;run=Math.max(run,p.v);
    return (isPr?'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="7" fill="none" stroke="#fff" stroke-width="1.6" opacity=".9"/>':'')+'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(pts.length>30?2:3.5)+'" fill="#22d3ee"/>'}).join("");
  const gl=goal>0?'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(goal).toFixed(1)+'" y2="'+y(goal).toFixed(1)+'" stroke="#ff4d4d" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="'+(W-pr-62)+'" y="'+(y(goal)-17).toFixed(1)+'" width="62" height="14" rx="4" fill="rgba(255,77,77,.18)"/><text x="'+(W-pr-4)+'" y="'+(y(goal)-6.5).toFixed(1)+'" fill="#ff8080" font-size="10" font-weight="700" text-anchor="end">Doel '+fmtKg(goal)+'</text>':'';
  const lbl=(i,anchor)=>'<text x="'+x(i)+'" y="'+(H-8)+'" fill="#8b919c" font-size="10" text-anchor="'+anchor+'">'+esc(fmtDate(pts[i].d,{day:"numeric",month:"short"}))+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs>'+g+
    (pts.length>1?'<path d="'+area+'" fill="url(#ga)"/><path d="'+d+'" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>':"")+dots+
    gl+lbl(0,pts.length===1?"middle":"start")+(pts.length>1?lbl(pts.length-1,"end"):"")+'</svg>';
}

      (next?'<button class="adv" data-act="advance" data-id="'+esc(c.id)+'">→ '+next+'</button>':'')+
      '</div></div>';
  }
  return h;

function saveAsTpl(d,silent){
  const name=(d.name||"").trim()||"Mijn schema";
  const ex=(d.exercises||[]).filter(e=>(e.name||"").trim()).map(e=>({name:e.name.trim(),exId:e.exId,sets:Array.isArray(e.sets)?Math.max(1,e.sets.length):Math.max(1,num(e.sets)||3)}));
  if(!ex.length){toast("Voeg eerst oefeningen toe");return false}
  const l=getWT();let t=l.find(x=>x.id===d.tplId)||l.find(x=>norm(x.name)===norm(name));
  if(t){t.name=name;t.exercises=ex}else{t={id:uid(),name,exercises:ex};l.push(t)}
  saveWT(l);d.tplId=t.id;if(!silent)toast("Schema “"+name+"” opgeslagen 💾");return true;

/* picker overlay (boven het trainingsscherm) */
const PK={group:"Populair",q:"",replace:null};
function recentExercises(){
  const seen=new Set(),out=[];
  for(const w of sortedWorkouts())for(const ex of w.exercises||[]){const k=norm(ex.name);if(!k||seen.has(k))continue;seen.add(k);out.push({name:ex.name.trim(),e:exFor(ex)})}
  return out.slice(0,24);
}
function openPicker(replace){
  PK.q="";PK.replace=replace==null?null:replace;PK.group=recentExercises().length?"Recent":"Populair";
  let el=$("#picker");if(!el){el=document.createElement("div");el.id="picker";document.body.appendChild(el)}
  el.innerHTML='<div class="pk"><div class="sheet-head"><button class="link" data-pk="close">Sluiten</button><h2>'+(replace!=null?"Oefening wisselen":"Oefening kiezen")+'</h2><span style="width:60px"></span></div>'+
    '<div class="pk-search"><input id="pkQ" type="search" placeholder="Zoek oefening (Engels), bv. squat" autocomplete="off"></div>'+
    '<div class="chips pk-chips" id="pkChips"></div><div class="pk-body" id="pkBody"></div></div>';
  el.classList.add("open");renderPicker();
}
function closePicker(){const el=$("#picker");if(el){el.classList.remove("open");el.innerHTML=""}}
function renderPicker(){
  const rec=recentExercises();
  const groups=EXGROUPS.filter(g=>g!=="Recent"||rec.length);
  $("#pkChips").innerHTML=groups.map(g=>'<button class="chip '+(PK.group===g&&!PK.q?"on":"")+'" data-pk="group" data-v="'+g+'">'+g+'</button>').join("");
  const q=norm(PK.q);let items=[],extra="";
  if(q){items=EX.filter(e=>norm(e.name).includes(q)||norm(e.muscle).includes(q)).sort((a,b)=>b.pop-a.pop).slice(0,60).map(e=>({name:e.name,e}));
    extra='<button class="pk-custom" data-pk="custom">+ “'+esc(PK.q.trim())+'” toevoegen als eigen oefening</button>'}
  else if(PK.group==="Recent")items=rec;
  else if(PK.group==="Populair")items=EX.filter(e=>e.pop).map(e=>({name:e.name,e}));
  else if(PK.group==="Alles")items=EX.filter(e=>e.pop).concat(EX.filter(e=>!e.pop).slice(0,80)).map(e=>({name:e.name,e}));
  else items=EX.filter(e=>e.group===PK.group).sort((a,b)=>b.pop-a.pop).slice(0,80).map(e=>({name:e.name,e}));
  PK.items=items;
  $("#pkBody").innerHTML=extra+(items.length?'<div class="pk-grid">'+items.map((it,i)=>'<button class="pk-card" data-pk="pick" data-i="'+i+'">'+exThumb(it.e,"pk-img")+'<b>'+esc(it.name)+'</b><span>'+(it.e?esc(it.e.muscle):"eigen oefening")+'</span></button>').join("")+'</div>':(EX.length?'<div class="empty">Geen oefeningen gevonden.</div>':'<div class="empty">Oefeningen laden…</div>'))+
    (!q&&PK.group!=="Recent"&&PK.group!=="Populair"?'<div class="small muted" style="text-align:center;margin:14px 0">Zoek om alle '+EX.length+' oefeningen te doorzoeken</div>':'');
}
function pickExercise(it){
  const d=S.draft;if(!d)return;
  const entry={name:it.name,exId:it.e?it.e.id:undefined};
  if(S.sheet==="wtpl"){if(PK.replace!=null&&d.exercises[PK.replace])Object.assign(d.exercises[PK.replace],entry);else d.exercises.push(Object.assign(entry,{sets:3}));
    const idx=PK.replace!=null?PK.replace:d.exercises.length-1;closePicker();renderSheet();
    setTimeout(()=>{const box=document.querySelectorAll("#sheet .ex")[idx];if(box)box.scrollIntoView({block:"center",behavior:"smooth"})},60);return}
  if(PK.replace!=null&&d.exercises[PK.replace]){Object.assign(d.exercises[PK.replace],entry)}
  else{const prev=lastTimeFor(it.name,d.id,d.date);const n=prev?Math.max(1,prev.ex.sets.length):3;d.exercises.push(Object.assign(entry,{sets:Array.from({length:n},()=>blankSet())}))}
  const idx=PK.replace!=null?PK.replace:d.exercises.length-1;
  closePicker();renderSheet();
  setTimeout(()=>{const box=document.querySelectorAll("#sheet .ex")[idx];if(box)box.scrollIntoView({block:"center",behavior:"smooth"})},60);
}
function exInfo(i){
  const ex=S.draft.exercises[i],e=exFor(ex);
  const ov=document.createElement("div");ov.className="exinfo";
  ov.innerHTML='<div class="exi-card">'+(e?'<div class="exi-img">'+exThumb(e,"exi-ph")+'</div>':'')+'<h3>'+esc(ex.name)+'</h3><p>'+(e?esc(e.muscle)+(e.name!==ex.name?' · '+esc(e.name):''):'Eigen oefening, zonder foto')+'</p>'+
    '<button class="btn primary block" data-x="swap">↺ Andere oefening kiezen</button><button class="btn block" data-x="close" style="margin-top:8px">Sluiten</button></div>';
  ov.addEventListener("click",ev=>{const b=ev.target.closest("[data-x]");if(b&&b.dataset.x==="swap"){ov.remove();openPicker(i)}else if(b||ev.target===ov)ov.remove()});
  document.body.appendChild(ov);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-pk]");if(!b)return;ev.stopPropagation();
  const a=b.dataset.pk;
  if(a==="close")closePicker();
  else if(a==="group"){PK.group=b.dataset.v;PK.q="";const q=$("#pkQ");if(q)q.value="";renderPicker();$("#pkBody").scrollTop=0}

},true);
document.addEventListener("input",ev=>{if(ev.target.id==="pkQ"){PK.q=ev.target.value;renderPicker()}});

function sheetContent(){
