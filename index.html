<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="kaushan-script.woff2" as="font" type="font/woff2" crossorigin>
<title>Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0e11; --card:#17191e; --card2:#1f2229; --line:#2a2e37;
  --text:#f2f3f5; --muted:#8b919c; --acc:#c8ff2e; --acc-ink:#121400;
  --red:#ff5c5c; --blue:#5cb3ff; --orange:#ffa94d; --violet:#b48cff; --green:#4ade80;
  --r:16px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{min-height:100vh;margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:70px}
input[type=date]{min-height:46px}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0}
.app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 112px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
header.top h1{font-family:"Kaushan Script",cursive;font-weight:400;font-size:46px;line-height:1.1;letter-spacing:0;padding:2px 10px 8px 2px;margin:0 0 -8px -2px;
  background:linear-gradient(100deg,#ffd9a8 0%,#ffa45c 45%,#e3ff6a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
header.top .hello{color:#ffe6d2;opacity:.75;font-size:14px;font-weight:600}
header.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
body{background:radial-gradient(110% 340px at 90% -60px,rgba(255,140,60,.2),transparent 70%) no-repeat,var(--bg)}
.hero{border-radius:22px;padding:16px;margin-bottom:10px;background:linear-gradient(160deg,rgba(255,150,70,.16),rgba(23,25,30,.9) 55%);border:1px solid rgba(255,170,100,.16)}
.hero-label{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#ffcfa3}
.hero-big{font-family:Archivo;font-size:40px;font-weight:800;line-height:1.1}
.hero-big small{font-size:15px;font-weight:600;color:var(--muted);margin-left:4px}
.streak{background:rgba(255,140,60,.15);color:#ffb26b;border-radius:14px;padding:8px 12px;font-weight:800;font-size:15px;text-align:center}
.streak small{display:block;font-size:11px;font-weight:600;opacity:.75}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd span{font-size:11px;color:var(--muted);font-weight:600}
.wd i{font-style:normal;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:rgba(255,255,255,.05);color:var(--muted)}
.wd.future i{opacity:.45}
.wd.today i{border:2px solid #ffa45c;color:#ffe6d2}
.wd.today span{color:#ffa45c}
.wd.done i{background:linear-gradient(135deg,#ffb26b,#e3ff6a);color:#1a1000;box-shadow:0 4px 14px rgba(255,150,70,.35)}
.wd.done i svg{width:18px;height:18px}
.btn.big{padding:16px;font-size:16px;border-radius:16px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li b{display:block;font-weight:700}
.li span{font-size:12px;color:var(--muted)}
.li .pr{text-align:right}.li .pr b{font-family:Archivo;color:#ffb26b}.li .pr span{color:var(--acc)}
.card.next{border:1px solid rgba(255,255,255,.05)}
.card.wcard{display:flex;gap:12px;align-items:stretch}
.dblock{flex:none;width:50px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.dblock b{font-family:Archivo;font-size:22px;line-height:1}
.dblock span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-top:3px}
.wbody{flex:1;min-width:0}
.wbody .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.chipsx{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chipx{font-size:12px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.05);color:#c9cdd4}
.chipx.more{color:#ffb26b}
.banner{background:#2a2410;border:1px solid #4a3f12;color:#ffd970;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px}
.stat b{display:block;font-family:Archivo;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--card2);border:1px solid var(--line)}
.btn.primary{background:linear-gradient(100deg,#ffb26b,#e3ff6a);color:#1a1000;border:0;box-shadow:0 8px 24px rgba(255,150,70,.22)}
.btn.danger{background:transparent;color:var(--red);border-color:#4a2626}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.section-label{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin:20px 2px 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;display:block;width:100%;text-align:left}
.card:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.w-date{font-size:12px;color:var(--muted);font-weight:600;text-transform:capitalize}
.w-name{font-family:Archivo;font-size:18px;font-weight:700;margin:2px 0 6px}
.w-ex{color:var(--muted);font-size:13px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.acc{background:rgba(200,255,46,.12);color:var(--acc)}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty .big{font-size:40px;margin-bottom:8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(13,14,17,0),rgba(13,14,17,.94) 28%);padding:14px 14px calc(var(--sab) + 10px);display:flex;justify-content:center;z-index:20}
nav.tabs .in{display:flex;gap:8px;max-width:560px;width:100%}
nav.tabs button{flex:1 1 0;min-width:0;height:58px;display:flex;align-items:center;justify-content:center;gap:0;border-radius:18px;
  background:rgba(31,34,41,.92);border:1px solid rgba(255,255,255,.06);color:#9aa0aa;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:flex-grow .4s cubic-bezier(.3,.8,.2,1),background .3s,color .3s,box-shadow .3s,gap .3s}
nav.tabs button:active{transform:scale(.96)}
nav.tabs button.on{flex-grow:2.6;gap:8px;color:#1a1000;border-color:transparent;background:linear-gradient(100deg,#ffb26b,#e3ff6a);box-shadow:0 8px 22px rgba(255,150,70,.3)}
nav.tabs button span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-family:Archivo,Inter,sans-serif;font-weight:800;font-size:15px;transition:max-width .4s cubic-bezier(.3,.8,.2,1),opacity .25s}
nav.tabs button.on span{max-width:130px;opacity:1;transition-delay:0s,.12s}
nav.tabs svg{width:24px;height:24px;flex:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip .n{opacity:.6;margin-left:4px}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none}
.sheet-wrap.open{display:block}
.sheet{position:absolute;inset:0;top:calc(var(--sat) + 10px);background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:17px}
.sheet-head .link{color:var(--muted);font-weight:600;padding:6px 2px}
.sheet-head .save{color:var(--acc);font-weight:800;padding:6px 2px}
.sheet-body{flex:1;overflow-y:auto;padding:16px 16px calc(var(--sab) + 40px);-webkit-overflow-scrolling:touch}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ex{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:12px}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-head input{font-weight:700}
.iconbtn{width:40px;height:40px;flex:none;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--card2)}
.iconbtn svg{width:18px;height:18px}
.prev{font-size:12px;color:var(--acc);margin:8px 2px 4px;opacity:.85}
.sets{margin-top:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;align-items:center;margin-bottom:6px}
.set .no{color:var(--muted);font-weight:700;text-align:center;font-size:13px}
.set input{text-align:center;padding:9px 6px}
.set-h{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;font-size:11px;color:var(--muted);font-weight:600;text-align:center;text-transform:uppercase;letter-spacing:.5px}
.set .x{height:36px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.copybox{background:rgba(200,255,46,.08);border:1px dashed rgba(200,255,46,.4);color:var(--acc);border-radius:12px;padding:11px;width:100%;font-weight:600;font-size:14px;margin-bottom:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
/* progress */
.chart{background:var(--card);border-radius:var(--r);padding:12px 8px 6px;margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rec{background:var(--card);border-radius:14px;padding:12px}
.rec b{font-family:Archivo;font-size:20px;display:block}
.rec span{font-size:12px;color:var(--muted)}
.hist{background:var(--card);border-radius:var(--r);overflow:hidden}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
/* content */
.c-title{font-weight:700;font-size:16px;margin:0 0 4px}
.c-hook{color:var(--muted);font-size:13px;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.st{padding:4px 9px;border-radius:999px;font-size:12px;font-weight:700}
.st-Idee{background:rgba(180,140,255,.14);color:var(--violet)}
.st-Gepland{background:rgba(92,179,255,.14);color:var(--blue)}
.st-Opgenomen{background:rgba(255,169,77,.14);color:var(--orange)}
.st-Bewerkt{background:rgba(255,217,112,.14);color:#ffd970}
.st-Gepost{background:rgba(74,222,128,.14);color:var(--green)}
.adv{margin-left:auto;font-size:12px;font-weight:700;color:var(--acc);padding:6px 8px;border-radius:8px;background:rgba(200,255,46,.08)}
.late{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 100px);transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--sab) + 96px);width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#ffb26b,#e3ff6a);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(200,255,46,.25);z-index:15}
.fab svg{width:28px;height:28px}
/* schema's */
.wt-row{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.wt-row::-webkit-scrollbar{display:none}
.wt-card{position:relative;flex:none;width:150px;scroll-snap-align:start;border-radius:20px;background:linear-gradient(160deg,rgba(255,150,70,.14),var(--card) 60%);border:1px solid rgba(255,170,100,.14);text-align:left}
.wt-main{display:block;width:100%;padding:12px;text-align:left}
.wt-ths{display:flex;margin-bottom:10px}
.wt-th{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--card);margin-right:-12px}
.wt-th.noimg svg{width:20px;height:20px}
.wt-card b{display:block;font-family:"Kaushan Script",cursive;font-weight:400;font-size:24px;line-height:1.15;padding-right:4px;background:linear-gradient(100deg,#ffd9a8,#ffa45c 50%,#e3ff6a);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt-card span{display:block;font-size:12px;color:var(--muted)}
.wt-card em{display:inline-block;margin-top:10px;font-style:normal;font-size:12px;font-weight:800;color:#1a1000;background:linear-gradient(100deg,#ffb26b,#e3ff6a);padding:5px 10px;border-radius:9px}
.wt-edit{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:10px;background:rgba(0,0,0,.35);color:#ffe6d2;font-size:15px}
.wt-new{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;padding:14px;background:var(--card);border:1.5px dashed rgba(255,170,100,.35);min-height:150px}
.wt-new i{font-style:normal;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#ffb26b,#e3ff6a);color:#1a1000;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.wt-new b{font-family:Archivo;font-size:16px;background:none;-webkit-background-clip:initial;background-clip:initial;color:#fff}
.tpl-pick{margin-bottom:12px}.tpl-pick small{opacity:.6;margin-left:3px}
.tpl-ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.tpl-ctl .stepper input{width:48px}
.tpl-ord{display:flex;flex-direction:column;gap:4px}
.tpl-ord button{width:34px;height:26px;border-radius:8px;background:var(--card2);color:#ffb26b;font-size:11px}
.tpl-ord button:disabled{opacity:.3}
/* oefeningen */
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.wk-title{font-family:"Kaushan Script",cursive;font-size:34px;line-height:1.15;padding:0 6px 6px 0;background:linear-gradient(100deg,#ffd9a8,#ffa45c 50%,#e3ff6a);-webkit-background-clip:text;background-clip:text;color:transparent;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wk-date{width:auto;flex:none;min-height:40px;padding:8px 10px;font-size:14px}
.wk-names{margin:-2px 0 14px}
.ex-empty{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;padding:28px 16px;border-radius:20px;border:1.5px dashed rgba(255,170,100,.4);background:rgba(255,150,70,.06);margin-bottom:12px}
.ex-empty .ee-ic{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#ffb26b,#e3ff6a);color:#1a1000;display:flex;align-items:center;justify-content:center}
.ex-empty .ee-ic svg{width:30px;height:30px}
.ex-empty b{font-family:Archivo;font-size:18px}.ex-empty span{font-size:13px;color:var(--muted)}
.ex{background:var(--card);border-radius:20px;padding:10px;margin-bottom:12px}
.ex-head{display:flex;gap:12px;align-items:center}
.exph-btn{flex:none}
.exph,.pk-img,.exi-ph,.wt-th{position:relative;display:block;overflow:hidden;background:#e9e6e1}
.exph{width:76px;height:64px;border-radius:14px}
.exph img,.pk-img img,.exi-ph img,.wt-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.exph img.alt,.pk-img img.alt,.exi-ph img.alt,.wt-th img.alt{animation:exswap 2.4s ease-in-out infinite}
@keyframes exswap{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.noimg{background:linear-gradient(135deg,rgba(255,178,107,.25),rgba(227,255,106,.15))!important;display:flex!important;align-items:center;justify-content:center;color:#ffcfa3}
.noimg img{display:none}
.noimg svg{width:30px;height:30px}
.ex-meta{flex:1;min-width:0}
.ex-meta b{display:block;font-family:Archivo;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.ex-meta span{font-size:12px;color:var(--muted)}
.mtag{font-style:normal;display:inline-block;padding:2px 7px;border-radius:6px;background:rgba(255,150,70,.14);color:#ffb26b;font-weight:600;margin-right:6px;text-transform:capitalize}
#picker{position:fixed;inset:0;z-index:70;display:none;background:rgba(0,0,0,.5)}
#picker.open{display:block}
.pk{position:absolute;inset:0;top:calc(var(--sat) + 22px);background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:up .22s ease}
.pk-search{padding:12px 16px 8px}
.pk-chips{margin:0 0 4px;padding-left:16px;padding-right:16px}
.pk-body{flex:1;overflow-y:auto;padding:6px 16px calc(var(--sab) + 30px);-webkit-overflow-scrolling:touch}
.pk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pk-card{background:var(--card);border-radius:16px;overflow:hidden;text-align:left;padding-bottom:10px}
.pk-card:active{transform:scale(.98)}
.pk-img{width:100%;aspect-ratio:3/2}
.pk-card b{display:block;font-size:14px;font-weight:700;padding:8px 10px 2px;line-height:1.25}
.pk-card span{display:block;font-size:12px;color:#ffb26b;padding:0 10px;text-transform:capitalize}
.pk-custom{width:100%;padding:13px;border-radius:14px;border:1.5px dashed rgba(255,170,100,.4);color:#ffb26b;font-weight:700;margin-bottom:12px}
.exinfo{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s}
.exi-card{background:var(--card);border-radius:22px;padding:14px;width:100%;max-width:400px;animation:popIn .35s cubic-bezier(.2,1.3,.4,1)}
.exi-ph{width:100%;aspect-ratio:3/2;border-radius:14px}
.exi-card h3{font-family:Archivo;font-size:22px;margin:12px 2px 2px}
.exi-card p{color:var(--muted);margin:0 2px 14px;text-transform:capitalize;font-size:14px}
/* macro-template */
.tpl-chips{margin-bottom:12px}
.tpl-hero{border-radius:22px;padding:16px;margin-bottom:12px;background:linear-gradient(160deg,rgba(255,150,70,.16),rgba(23,25,30,.9) 60%);border:1px solid rgba(255,170,100,.16);text-align:center}
.tpl-name{background:transparent;border:0;border-bottom:1px dashed rgba(255,200,150,.3);border-radius:0;text-align:center;font-weight:700;font-size:17px;color:#ffe6d2;padding:4px;margin-bottom:6px}
.tpl-k b{display:block;font-family:"Kaushan Script",cursive;font-weight:400;font-size:64px;line-height:1.1;padding:0 8px 6px;background:linear-gradient(100deg,#ffd9a8,#ffa45c 50%,#e3ff6a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tpl-k span{font-size:13px;color:#ffcfa3;font-weight:600}
.tpl-bar{display:flex;height:10px;border-radius:10px;overflow:hidden;margin:14px 0 8px;background:rgba(255,255,255,.06)}
.tpl-bar i{display:block;height:100%;transition:width .25s}
.tpl-leg{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tpl-leg em{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:16px;padding:10px 10px 10px 14px;margin-bottom:8px}
.mrow-l b{display:block;font-weight:700}
.mrow-l span{font-size:12px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:38px;height:42px;border-radius:12px;background:var(--card2);font-size:22px;font-weight:700;color:#ffb26b}
.kcal-in{font-weight:800;color:#ffb26b}
.stepper input{width:64px;text-align:center;font-weight:700;padding:9px 4px}
/* zwevende macro-balk */
#macroPill{position:fixed;left:12px;right:12px;top:calc(var(--sat) + 8px);z-index:25;max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:10px 12px;border-radius:26px;background:rgba(48,50,56,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.45);transform:translateY(-130%);opacity:0;transition:transform .35s cubic-bezier(.3,.8,.2,1),opacity .25s;pointer-events:none}
#macroPill.show{transform:none;opacity:1}
.mp{display:flex;align-items:center;gap:7px;min-width:0}
.mr{position:relative;width:40px;height:40px;flex:none}
.mr svg{width:100%;height:100%}
.mr .mi{position:absolute;left:11px;top:11px;width:18px;height:18px}
.mv{min-width:0;line-height:1.1}
.mv b{display:block;font-family:Archivo,Inter,sans-serif;font-size:16px;font-weight:800;white-space:nowrap}
.mv b small{font-family:Inter;font-weight:500;font-size:11px;color:var(--muted);margin-left:1px}
.mv span{font-size:11px;color:var(--muted);white-space:nowrap}
@media (max-width:370px){.mr{width:34px;height:34px}.mr .mi{left:9px;top:9px;width:16px;height:16px}.mv b{font-size:14px}}
/* voeding */
.meal{padding:4px 4px 6px}
.meal-top{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px 6px;text-align:left}
.meal-e{font-size:22px;line-height:1}
.meal-t{flex:1;min-width:0}.meal-t b{display:block;font-family:Archivo;font-size:16px}.meal-t span{font-size:12px;color:var(--muted)}
.meal-k{font-size:12px;color:var(--muted);white-space:nowrap}.meal-k b{font-family:Archivo;font-size:16px;color:#fff}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .25s;flex:none}
.meal.open .chev{transform:rotate(180deg)}
.meal-mac{display:flex;gap:12px;padding:0 12px 6px 44px;font-size:12px;color:var(--muted);font-weight:500;flex-wrap:wrap}
.meal-mac i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.meal-mac b{color:#fff}
.meal.open .meal-mac{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}

.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.mtile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:12px 14px;border-radius:18px;background:var(--card);border:1px dashed rgba(255,255,255,.12);text-align:left;min-height:92px}
.mtile:active{transform:scale(.98)}
.mtile .me{font-size:24px;line-height:1;margin-bottom:6px}
.mtile b{font-family:Archivo;font-size:16px}
.mtile .mt{font-size:12px;color:var(--muted)}
.mtile i{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg,#ffb26b,#e3ff6a);color:#1a1000;font-style:normal;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.meal-mac{display:flex;gap:10px;padding:0 10px 4px;font-size:12px;font-weight:700}

.daynav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:4px;margin-bottom:10px}
.daynav button{width:44px;height:38px;border-radius:10px;font-size:24px;line-height:1;color:#ffcfa3}
.daynav span{font-weight:700;text-transform:capitalize}
.fhero{display:flex;gap:14px;align-items:center}
.kring{position:relative;width:128px;height:128px;flex:none}
.kring svg{width:100%;height:100%}
.kring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kring b{font-family:Archivo;font-size:28px;line-height:1}
.kring span{font-size:11px;color:var(--muted);margin-top:3px}
.macros{flex:1;min-width:0}
.kline{font-size:13px;color:var(--muted);margin-bottom:8px}.kline b{color:#fff;font-family:Archivo;font-size:17px}
.mbar{margin-bottom:8px;font-size:12px}
.mbar span{color:var(--muted)}.mbar span b{color:#fff}
.mbar i{display:block;height:7px;border-radius:7px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
.mbar em{display:block;height:100%;border-radius:7px}
.water{padding:10px 12px}
.water .glasses{display:flex;justify-content:space-between;gap:2px;margin-top:6px}
.glass{flex:1;max-width:34px;height:30px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.25)}
.glass svg{width:20px;height:22px}
.glass .wf{fill:transparent;transition:fill .2s}
.glass.on{color:#5cb3ff}.glass.on .wf{fill:rgba(92,179,255,.55)}
.meal{background:var(--card);border-radius:var(--r);padding:6px 6px 6px;margin-bottom:10px}
.meal-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px 6px;font-family:Archivo;font-weight:700;font-size:16px}
.fitem,.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:12px}
.fitem:active,.frow:active{background:var(--card2)}
.fitem b,.frow b{display:block;font-weight:600;font-size:15px}
.fitem span,.frow span{font-size:12px;color:var(--muted)}
.fitem em,.frow em{font-style:normal;font-family:Archivo;font-weight:700;white-space:nowrap}
.frow em small{font-family:Inter;font-weight:500;color:var(--muted);font-size:11px}
.list .frow{border-radius:0;border-bottom:1px solid var(--line);padding:11px 14px}
.list .frow:last-child{border-bottom:0}
.fadd{width:100%;text-align:left;padding:10px;color:#ffb26b;font-weight:700;font-size:14px}
.calcbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calcbox div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}
.calcbox b{display:block;font-family:Archivo;font-size:22px}
.calcbox span{font-size:12px;color:var(--muted)}
.wkchart .bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:120px}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.btrack{position:relative;flex:1;width:100%;max-width:26px;border-radius:8px;background:rgba(255,255,255,.04)}
.btrack em{position:absolute;left:0;right:0;bottom:0;border-radius:8px;background:linear-gradient(180deg,#e3ff6a,#ffb26b)}
.btrack em.over{background:linear-gradient(180deg,#ff8a7a,#ff5c5c)}
.btrack .goal{position:absolute;left:-3px;right:-3px;height:2px;background:rgba(255,255,255,.35);border-radius:2px}
.bcol span{font-size:11px;color:var(--muted);text-transform:uppercase}
/* streak */
.flame{display:inline-block;width:22px;height:28px;vertical-align:-6px}
.flame svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,130,50,.6))}
.flame .f1{transform-origin:50% 100%;animation:flick 1.4s ease-in-out infinite}
.flame .f2{transform-origin:50% 100%;animation:flick 1s ease-in-out infinite reverse}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.04,.96) skewX(-2deg)}50%{transform:scale(.97,1.06) skewX(2deg)}75%{transform:scale(1.02,.98) skewX(-1deg)}}
.streak{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.streak .row1{display:flex;align-items:center;gap:6px;font-family:Archivo;font-size:22px;font-weight:800;color:#ffd0a0}
.streak.cold{background:rgba(255,255,255,.05);color:var(--muted)}
.streak.cold .row1{color:var(--muted)}
.streak.cold .flame{filter:grayscale(1);opacity:.5}
.hero-goal{margin-top:12px;font-size:13px;color:#ffcfa3}
.hero-goal b{color:#fff}
.sk-body{background:radial-gradient(120% 50% at 50% 0%,rgba(255,140,60,.22),transparent 70%)}
.sk-hero{position:relative;text-align:center;padding:10px 0 18px}
.sk-glow{position:absolute;left:50%;top:70px;width:300px;height:300px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,150,70,.35),transparent 65%);animation:breathe2 3.5s ease-in-out infinite;pointer-events:none}
@keyframes breathe2{50%{transform:translate(-50%,-50%) scale(1.15);opacity:.8}}
.sk-hero .flame{width:74px;height:96px;position:relative}
.sk-num{position:relative;font-family:"Kaushan Script",cursive;font-size:110px;line-height:1;margin-top:-6px;padding:0 10px 10px;
  background:linear-gradient(100deg,#ffd9a8,#ffa45c 50%,#e3ff6a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,140,60,.45))}
.sk-lbl{position:relative;font-family:Archivo;font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase;margin-top:-8px}
.sk-sub{position:relative;color:#ffcfa3;font-size:14px;margin-top:8px}
.sk-grid{display:flex;gap:10px}
.sk-stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sk-stats3 div{background:var(--card);border-radius:16px;padding:12px;text-align:center}
.sk-stats3 b{display:block;font-family:Archivo;font-size:26px}
.sk-stats3 span{font-size:12px;color:var(--muted)}
.sk-ring{position:relative;width:132px;flex:none;background:var(--card);border-radius:18px;padding:12px;text-align:center}
.sk-ring svg{width:100px;height:100px}
.sk-ring b{position:absolute;left:0;right:0;top:46px;font-family:Archivo;font-size:22px}
.sk-ring span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sk-stats{flex:1;display:grid;gap:10px}
.sk-stats div{background:var(--card);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.sk-stats b{font-family:Archivo;font-size:26px}
.sk-stats span{font-size:12px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;opacity:.38;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:linear-gradient(160deg,rgba(255,150,70,.2),var(--card) 70%);border:1px solid rgba(255,170,100,.2)}
.badge i{font-style:normal;font-size:24px;display:block}
.badge b{display:block;font-size:13px;margin-top:4px}
.badge span{font-size:10px;color:var(--muted)}
.goalseg button{flex:1;min-width:44px}
.imgov{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(var(--sat) + 20px) 24px calc(var(--sab) + 20px)}
.imgov img{max-height:68vh;max-width:100%;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.imgov p{color:#ffcfa3;font-size:14px;text-align:center;margin:0}
.celebrate{position:fixed;inset:0;z-index:300;background:rgba(10,8,6,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease;overflow:hidden}
.celebrate.bye{opacity:0;transition:opacity .3s}
@keyframes fadeIn{from{opacity:0}}
.celebrate i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#ffb070;box-shadow:0 0 10px 3px rgba(255,150,70,.7);animation:pop linear forwards}
@keyframes pop{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-100vh);opacity:0}}
.cb{position:relative;text-align:center;max-width:320px;width:100%;animation:popIn .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.cb .flame{width:90px;height:116px}
.cb h3{font-family:"Kaushan Script",cursive;font-weight:400;font-size:44px;margin:6px 0 4px;background:linear-gradient(100deg,#ffd9a8,#ffa45c 50%,#e3ff6a);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 6px 6px}
.cb p{color:#ffe6d2;margin:0 0 20px;font-size:16px;line-height:1.45}
.upd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(100deg,rgba(255,178,107,.18),rgba(227,255,106,.12));border:1px solid rgba(255,190,120,.35);color:#ffe6d2;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.upd b{margin-left:auto;background:linear-gradient(100deg,#ffb26b,#e3ff6a);color:#1a1000;border-radius:10px;padding:7px 12px;font-size:13px}
/* welcome */
@font-face{font-family:"Kaushan Script";src:url(kaushan-script.woff2) format("woff2");font-display:swap}
#welcome{position:fixed;inset:0;z-index:200;overflow:hidden;background:#07080a;color:#fff;transition:opacity .6s ease,transform .6s ease}
#welcome.out{opacity:0;transform:scale(1.05);pointer-events:none}
#welcome{touch-action:none;-webkit-user-select:none;user-select:none;will-change:transform;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#welcome.dragging{transition:none}
#welcome.snap{transition:transform .35s cubic-bezier(.3,.7,.2,1)}
#welcome.out-up{transform:translateY(-105%)!important;transition:transform .5s cubic-bezier(.3,.7,.2,1);pointer-events:none}
.wl-swipe{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:8px 0 2px;color:#ffe6d2;font-weight:600;font-size:14px;letter-spacing:.4px}
.wl-swipe svg{width:30px;height:30px;color:#ffb26b;filter:drop-shadow(0 0 10px rgba(255,160,80,.7));animation:nudge 1.6s ease-in-out infinite}
.wl-swipe svg+svg{margin-top:-22px;opacity:.45;animation-delay:.12s}
.wl-swipe span{opacity:.8}
@keyframes nudge{0%,100%{transform:translateY(4px)}50%{transform:translateY(-6px)}}
.wl-handle{width:44px;height:5px;border-radius:5px;background:rgba(255,236,220,.35);margin:10px auto 0}
.wl-bg{position:absolute;inset:0;opacity:0;transition:opacity 1.3s ease;
  background:radial-gradient(120% 70% at 85% 0%,rgba(255,140,60,.44),transparent 60%),
             radial-gradient(90% 60% at 0% 100%,rgba(200,255,46,.16),transparent 60%),
             linear-gradient(180deg,#1d1410 0%,#0d0e11 72%)}
#welcome.lit .wl-bg{opacity:1}
.wl-glow{position:absolute;width:440px;height:440px;border-radius:50%;left:50%;top:36%;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,170,90,.22),transparent 65%);opacity:0;pointer-events:none}
#welcome.lit .wl-glow{animation:breathe 5s 1s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}}
.wl-burst{position:absolute;left:50%;top:44%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,200,140,.95),rgba(255,130,50,.4) 40%,transparent 70%);transform:scale(0);opacity:0;pointer-events:none}
#welcome.lit .wl-burst{animation:burst 1.5s cubic-bezier(.15,.7,.2,1) forwards}
@keyframes burst{0%{transform:scale(0);opacity:1}100%{transform:scale(45);opacity:0}}
.wl-logo{position:absolute;left:50%;top:44%;width:120px;height:120px;transform:translate(-50%,-50%);color:#ffb26b;
  filter:drop-shadow(0 0 16px rgba(255,160,80,.75));animation:pulse 1.1s .9s ease-in-out}
.wl-logo path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .8s .2s cubic-bezier(.6,0,.3,1) forwards}
.wl-logo path:nth-child(2){animation-delay:.35s}.wl-logo path:nth-child(3){animation-delay:.5s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.15);filter:drop-shadow(0 0 30px rgba(255,170,90,1))}}
#welcome.lit .wl-logo{animation:logoOut .7s .25s ease forwards}
.wl-mono{position:absolute;left:50%;top:calc(44% + 64px);transform:translateX(-50%);font-family:"Kaushan Script",cursive;font-size:46px;line-height:1.2;padding:0 10px 8px 6px;white-space:nowrap;
  background:linear-gradient(100deg,#ffd9a8,#ffa45c 50%,#e3ff6a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,160,80,.55));clip-path:inset(-30% 100% -30% 0);animation:write .7s .75s cubic-bezier(.45,.05,.3,1) forwards;pointer-events:none}
#welcome.lit .wl-mono{clip-path:inset(-30% -5% -30% 0);animation:monoOut .7s .25s ease forwards}
@keyframes monoOut{to{opacity:0;transform:translate(-50%,-70px) scale(.6)}}
@keyframes logoOut{to{opacity:0;transform:translate(-50%,-120%) scale(.55)}}
.ember{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:#ffb070;box-shadow:0 0 8px 2px rgba(255,150,70,.6);opacity:0;pointer-events:none}
#welcome.lit .ember{animation:ember linear infinite}
@keyframes ember{0%{opacity:0;transform:translate(0,0)}10%{opacity:.9}80%{opacity:.5}100%{opacity:0;transform:translate(var(--dx),-105vh)}}
.wl-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(var(--sat) + 40px) 28px calc(var(--sab) + 32px)}
.wl-top{display:flex;align-items:center;justify-content:space-between;opacity:0}
.wl-date{display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,200,150,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.wl-day{width:52px;height:56px;border-radius:14px;background:linear-gradient(160deg,#ffb26b,#e3ff6a);color:#1a1000;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(255,150,70,.35)}
.wl-day small{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.75;line-height:1}
.wl-day b{font-family:Archivo,Inter,sans-serif;font-size:26px;font-weight:800;line-height:1.05}
.wl-dtxt b{display:block;font-family:"Kaushan Script",cursive;font-weight:400;font-size:24px;line-height:1.15;color:#ffe6d2}
.wl-dtxt span{font-size:13px;color:rgba(255,236,220,.6);font-weight:500}
.wl-wk{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#ffcfa3;padding:7px 11px;border-radius:999px;background:rgba(255,140,60,.12);border:1px solid rgba(255,170,100,.2)}
.wl-greet{font-family:Archivo,Inter,sans-serif;font-size:26px;font-weight:700;color:#ffe6d2;opacity:0}
.wl-name-wrap{filter:drop-shadow(0 6px 26px rgba(255,140,60,.38))}
.wl-name{font-family:"Kaushan Script",cursive;font-size:clamp(68px,20vw,104px);line-height:1.05;margin:0 0 -12px -4px;padding:4px 8px 24px 4px;
  background:linear-gradient(100deg,#ffd9a8 0%,#ffa45c 45%,#e3ff6a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  word-break:break-word;clip-path:inset(-20% 100% -20% 0)}
.wl-quote{position:relative;font-size:19px;line-height:1.5;color:#fff4ea;max-width:350px;margin-top:22px;padding-left:2px;opacity:0}
.wl-quote .qm{font-family:"Kaushan Script",cursive;font-size:64px;line-height:0;color:#ffa45c;position:relative;top:24px;margin-right:8px;opacity:.9;display:inline-block}
.wl-bottom{opacity:0}
#welcome.show .wl-top{animation:rise .8s ease forwards}
#welcome.show .wl-greet{animation:rise .8s .1s ease forwards}
#welcome.show .wl-name{animation:write 1.5s .35s cubic-bezier(.45,.05,.3,1) forwards}
#welcome.show .wl-quote{animation:rise 1s 1.5s ease forwards}
#welcome.show .wl-bottom{animation:rise .9s 2s ease forwards}
@keyframes write{to{clip-path:inset(-20% -5% -20% 0)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#welcome.skip *,#welcome.skip{animation-delay:0s!important;animation-duration:.25s!important}
#welcome.skip .wl-glow{animation:none!important;opacity:.8}
#welcome.skip .ember{animation-duration:9s!important}
.wl-stats{display:flex;gap:10px;margin-bottom:18px}
.wl-stat{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.wl-stat b{display:block;font-family:Archivo;font-size:22px;color:#fff}
.wl-stat span{font-size:12px;color:rgba(255,236,220,.65)}
.wl-go{width:100%;padding:17px;border-radius:18px;font-weight:800;font-size:17px;color:#1a1000;
  background:linear-gradient(100deg,#ffb26b,#e3ff6a);box-shadow:0 10px 30px rgba(255,150,70,.3)}
.wl-go:active{transform:scale(.98)}
.wl-ask{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px calc(var(--sab) + 40px)}
.wl-ask h2{font-family:Archivo;font-size:30px;line-height:1.2;color:#fff4ea;margin-bottom:10px}
.wl-ask p{color:rgba(255,236,220,.7);margin:0 0 22px;font-size:16px;line-height:1.5}
.wl-ask input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);font-size:22px;padding:16px;border-radius:16px;margin-bottom:12px;text-align:center}
.wl-ask input:focus{border-color:#ffa45c}
@media (prefers-reduced-motion:reduce){#welcome *{animation:none!important;transition:none!important}
  #welcome .wl-top,#welcome .wl-greet,#welcome .wl-quote,#welcome .wl-bottom{opacity:1}#welcome .wl-name{clip-path:none}#welcome .wl-logo,#welcome .wl-mono{display:none}}

const LKEY="gym_app_v1";
const Store={
  base:null,
  async init(){
    S.mode="local";this.loadLocal();
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    render();
  },
  sub(kind){
    let done=false;
    const timer=setTimeout(()=>{if(!done){S.slow=true;render()}},10000);
    this.base.collection(kind).onSnapshot(snap=>{
      S[kind]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      if(!snap.metadata.fromCache){done=true;clearTimeout(timer);S.slow=false}
      render();
    },err=>{done=true;clearTimeout(timer);S.err="Gegevens konden niet geladen worden ("+(err&&err.code||"fout")+").";render()});
  },
  loadLocal(){
    try{const d=JSON.parse(localStorage.getItem(LKEY)||"{}");S.workouts=d.workouts||[];S.content=d.content||[];S.food=d.food||[]}catch(e){}
  },
  persist(){
    try{localStorage.setItem(LKEY,JSON.stringify({workouts:S.workouts,content:S.content,food:S.food}))}catch(e){}
  },
  async save(kind,obj){
    obj=clone(obj);const id=obj.id;delete obj.id;
    if(S.mode==="cloud"){
      try{await this.base.collection(kind).doc(id).set(obj)}
      catch(e){
        if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));await this.base.collection(kind).doc(id).set(obj);return}
        throw e;
      }
    }else{
      obj.id=id;const arr=S[kind];const i=arr.findIndex(x=>x.id===id);
      if(i>=0)arr[i]=obj;else arr.push(obj);this.persist();render();
    }
  },
  async remove(kind,id){
    if(S.mode==="cloud"){await this.base.collection(kind).doc(id).delete()}
    else{S[kind]=S[kind].filter(x=>x.id!==id);this.persist();render()}
  }
};

async function exportBackup(){
  const data={app:"gym",version:1,exportedAt:new Date().toISOString(),workouts:S.workouts,content:S.content,food:S.food,foodGoals:getFoodGoals(),macroTemplates:getTpls(),workoutTemplates:getWT(),water:(()=>{try{return JSON.parse(lsGet(WAKEY)||"{}")}catch(e){return {}}})()};
  const name="gym-backup-"+today()+".json";
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  let done=false;
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});done=true}
  }catch(e){if(e&&e.name==="AbortError")return}
  if(!done){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
  try{localStorage.setItem(BKEY,String(Date.now()))}catch(e){}
  toast("Backup gemaakt ✓");if(S.sheet==="settings")renderSheet();render();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.content))throw 0;
      let added=0;
      if(d.foodGoals&&!lsGet(FGKEY))lsSet(FGKEY,JSON.stringify(d.foodGoals));
      if(d.macroTemplates&&!lsGet(TKEY))lsSet(TKEY,JSON.stringify(d.macroTemplates));
      if(Array.isArray(d.workoutTemplates)){const cur=getWT();for(const t of d.workoutTemplates)if(t&&t.id&&!cur.some(x=>x.id===t.id))cur.push(t);saveWT(cur)}
      if(d.water&&typeof d.water==="object"){let m={};try{m=JSON.parse(lsGet(WAKEY)||"{}")}catch(e){}lsSet(WAKEY,JSON.stringify(Object.assign({},d.water,m)))}
      for(const kind of ["workouts","content","food"])for(const item of (d[kind]||[])){
        if(!item||typeof item!=="object"||!item.id)continue;
        const i=S[kind].findIndex(x=>x.id===item.id);
        if(i>=0)S[kind][i]=item;else{S[kind].push(item);added++}
      }
      Store.persist();render();if(S.sheet==="settings")renderSheet();
      toast("Backup teruggezet ("+added+" nieuw)");
    }catch(e){toast("Dit is geen geldig backup-bestand")}
  };
  r.readAsText(file);
}

function nextQuote(){
  let st={};try{st=JSON.parse(lsGet(QKEY)||"{}")||{}}catch(e){}
  const n=QUOTES.length;
  if(!Array.isArray(st.order)||st.order.length!==n||!(st.i<n)){
    const last=Array.isArray(st.order)&&st.i>0?st.order[st.i-1]:-1;
    const o=[...Array(n).keys()];
    for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}
    if(o[0]===last)[o[0],o[n-1]]=[o[n-1],o[0]];
    st={order:o,i:0};
  }
  const q=QUOTES[st.order[st.i]];st.i++;lsSet(QKEY,JSON.stringify(st));return q;
}

    '<div class="wl-wk">Week '+isoWeek(d)+'</div>'}

(function(){
  const el=$("#welcome");let y0=null,t0=0,dy=0,moved=false,pid=null;
  el.addEventListener("click",ev=>{if(moved){moved=false;ev.stopPropagation();ev.preventDefault();return}
    if(!ev.target.closest(".wl-go,.wl-swipe,form")&&!el.classList.contains("show"))skipIntro()},true);
  el.addEventListener("pointerdown",ev=>{
    if(ev.target.closest("form")||!el.classList.contains("show")||el.classList.contains("out-up"))return;
    y0=ev.clientY;t0=performance.now();dy=0;moved=false;pid=ev.pointerId;el.classList.remove("snap");el.classList.add("dragging");
  });
  el.addEventListener("pointermove",ev=>{
    if(y0==null)return;dy=ev.clientY-y0;if(Math.abs(dy)>6&&!moved){moved=true;try{el.setPointerCapture(pid)}catch(e){}}
    const d=dy<0?dy:dy*0.25;el.style.transform="translateY("+d+"px)";
  });
  const end=()=>{
    if(y0==null)return;const v=dy/Math.max(1,performance.now()-t0);y0=null;el.classList.remove("dragging");
    if(dy<-innerHeight*0.22||(dy<-60&&v<-0.6))hideWelcome();

const MILESTONES=[[1,"Eerste dag","🌱"],[10,"Op gang","⚡"],[25,"Vaste prik","💪"],[50,"Halve eeuw","🔥"],[100,"Honderd!","🏅"],[150,"Machine","🚀"],[250,"Beest","🏆"],[365,"Een jaar vol","👑"]];
function dayInfo(){
  const t=today(),dates=new Set(S.workouts.filter(w=>w.date&&w.date<=t).map(w=>w.date));
  const monS=weekStart(new Date()),mo=t.slice(0,7),yr=t.slice(0,4);
  let week=0,month=0,year=0;for(const d of dates){if(d>=monS)week++;if(d.startsWith(mo))month++;if(d.startsWith(yr))year++}
  const total=dates.size,next=MILESTONES.find(m=>m[0]>total);
  return {total,week,month,year,next};
}

const APP_VERSION="1.6.1";
async function checkUpdate(manual){
  if(location.protocol!=="https:"||location.hostname.endsWith("claude.ai")||location.hostname.includes("claudeusercontent")){if(manual)toast("Updates werken in de app op je beginscherm");return}
  try{
    const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;
    const v=await r.json();
    if(v&&v.version&&v.version!==APP_VERSION){S.update=v;render();if(S.sheet==="settings")renderSheet();if(manual)toast("Nieuwe versie gevonden ✨")}
    else if(manual)toast("Je hebt de nieuwste versie ✓");
  }catch(e){if(manual)toast("Geen internet, probeer later opnieuw")}
}
async function doUpdate(){
  toast("Updaten…");
  try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
  try{const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}catch(e){}
  location.reload();
}

const sortedWorkouts=()=>S.workouts.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.createdAt||0)-(a.createdAt||0));

    const k=norm(ex.name);if(!k)continue;
    if(!m.has(k))m.set(k,{name:ex.name.trim(),count:0});

}

}

function weekStart(d){const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)}
function streakWeeks(){
  const set=new Set(S.workouts.filter(w=>w.date&&w.date<=today()).map(w=>weekStart(toD(w.date))));
  let d=toD(weekStart(new Date()));let n=0;
  if(!set.has(iso(d)))d.setDate(d.getDate()-7);
  while(set.has(iso(d))){n++;d.setDate(d.getDate()-7)}
  return n;
}
function recentPRs(){
  const by=new Map();
  for(const w of S.workouts)for(const ex of w.exercises||[]){
    const k=norm(ex.name);if(!k)continue;const mx=Math.max(0,...(ex.sets||[]).map(s=>num(s.kg)));if(!mx)continue;
    if(!by.has(k))by.set(k,[]);by.get(k).push({name:ex.name.trim(),date:w.date,max:mx});
  }
  const out=[];const lim=iso(new Date(Date.now()-30*864e5));
  for(const arr of by.values()){
    arr.sort((a,b)=>a.date.localeCompare(b.date));let best=0;
    arr.forEach((s,i)=>{if(i>0&&s.max>best&&s.date>=lim)out.push({name:s.name,date:s.date,max:s.max,diff:s.max-best});best=Math.max(best,s.max)});
  }
  return out.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3);
}

function viewProg(){
  let h='<header class="top"><div><h1>Progressie</h1><div class="sub">Per oefening, over tijd</div></div>'+GEAR+'</header>';
  const idx=exerciseIndex();
  if(!idx.length)return h+'<div class="empty"><div class="big">📈</div>Log eerst een paar trainingen, dan zie je hier je progressie per oefening.</div>';
  if(!S.progEx||!idx.some(e=>norm(e.name)===norm(S.progEx)))S.progEx=idx[0].name;
  h+='<div class="field"><select id="progSel">'+idx.map(e=>'<option value="'+esc(e.name)+'"'+(norm(e.name)===norm(S.progEx)?" selected":"")+'>'+esc(e.name)+' ('+e.count+'×)</option>').join("")+'</select></div>';
  const k=norm(S.progEx);
  const sess=[];
  for(const w of S.workouts){
    for(const ex of w.exercises||[]){
      if(norm(ex.name)!==k)continue;
      const sets=(ex.sets||[]).filter(s=>num(s.kg)||num(s.reps));
      if(!sets.length)continue;
      let max=0,best=0,bestSet=null,vol=0;
      for(const s of sets){const kg=num(s.kg),r=num(s.reps);vol+=kg*r;if(kg>max)max=kg;const e=e1rm(kg,r);if(e>best){best=e;bestSet=s}}
      sess.push({date:w.date,sets,max,best,bestSet,vol});
    }
  }
  sess.sort((a,b)=>a.date.localeCompare(b.date));
  const metrics=[["max","Max gewicht"],["e1rm","Geschat 1RM"],["vol","Volume"]];
  h+='<div class="seg" style="margin-bottom:10px">'+metrics.map(([k2,l])=>'<button data-metric="'+k2+'" class="'+(S.metric===k2?"on":"")+'">'+l+'</button>').join("")+'</div>';
  const key=S.metric==="max"?"max":S.metric==="e1rm"?"best":"vol";
  h+='<div class="chart">'+chartSvg(sess.map(s=>({d:s.date,v:s[key]})))+'</div>';
  let prMax=null,prE=null;
  for(const s of sess){if(!prMax||s.max>prMax.max)prMax=s;if(!prE||s.best>prE.best)prE=s}
  const first=sess[0],lastS=sess[sess.length-1];
  const diff=lastS&&first?lastS.max-first.max:0;
  h+='<div class="recs">'+
    '<div class="rec"><b>'+fmtKg(prMax.max)+' kg</b><span>PR gewicht · '+esc(fmtDate(prMax.date,{day:"numeric",month:"short"}))+'</span></div>'+
    '<div class="rec"><b>'+fmtKg(prE.best)+' kg</b><span>Beste geschat 1RM</span></div>'+
    '<div class="rec"><b>'+sess.length+'</b><span>sessies gelogd</span></div>'+
    '<div class="rec"><b>'+(diff>=0?"+":"")+fmtKg(diff)+' kg</b><span>sinds eerste sessie</span></div></div>';
  h+='<div class="section-label">Geschiedenis</div><div class="hist">'+sess.slice().reverse().map(s=>'<div><span class="muted">'+esc(fmtDate(s.date,{day:"numeric",month:"short",year:"2-digit"}))+'</span><span>'+esc(setsStr(s.sets))+'</span></div>').join("")+'</div>';
  return h;
}

function chartSvg(pts){
  const W=340,H=170,pl=36,pr=12,pt=14,pb=26;
  if(!pts.length)return "";
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);
  if(hi===lo){hi+=1;lo=Math.max(0,lo-1)}
  const padV=(hi-lo)*.12;lo=Math.max(0,lo-padV);hi+=padV;
  const x=i=>pts.length===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g="";
  for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;const yy=y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2a2e37" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(yy+4)+'" fill="#8b919c" font-size="10" text-anchor="end">'+Math.round(v)+'</text>'}
  const d=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=d+" L"+x(pts.length-1).toFixed(1)+" "+(H-pb)+" L"+x(0).toFixed(1)+" "+(H-pb)+" Z";
  const dots=pts.map((p,i)=>'<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.v).toFixed(1)+'" r="'+(pts.length>30?2:3.5)+'" fill="#c8ff2e"/>').join("");
  const lbl=(i,anchor)=>'<text x="'+x(i)+'" y="'+(H-8)+'" fill="#8b919c" font-size="10" text-anchor="'+anchor+'">'+esc(fmtDate(pts[i].d,{day:"numeric",month:"short"}))+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c8ff2e" stop-opacity=".25"/><stop offset="1" stop-color="#c8ff2e" stop-opacity="0"/></linearGradient></defs>'+g+
    (pts.length>1?'<path d="'+area+'" fill="url(#ga)"/><path d="'+d+'" fill="none" stroke="#c8ff2e" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>':"")+dots+
    lbl(0,pts.length===1?"middle":"start")+(pts.length>1?lbl(pts.length-1,"end"):"")+'</svg>';
}

      (next?'<button class="adv" data-act="advance" data-id="'+esc(c.id)+'">→ '+next+'</button>':'')+

function saveAsTpl(d,silent){
  const name=(d.name||"").trim()||"Mijn schema";
  const ex=(d.exercises||[]).filter(e=>(e.name||"").trim()).map(e=>({name:e.name.trim(),exId:e.exId,sets:Array.isArray(e.sets)?Math.max(1,e.sets.length):Math.max(1,num(e.sets)||3)}));
  if(!ex.length){toast("Voeg eerst oefeningen toe");return false}
  const l=getWT();let t=l.find(x=>x.id===d.tplId)||l.find(x=>norm(x.name)===norm(name));
  if(t){t.name=name;t.exercises=ex}else{t={id:uid(),name,exercises:ex};l.push(t)}
  saveWT(l);d.tplId=t.id;if(!silent)toast("Schema “"+name+"” opgeslagen 💾");return true;
}

/* picker overlay (boven het trainingsscherm) */
const PK={group:"Populair",q:"",replace:null};
function recentExercises(){
  const seen=new Set(),out=[];
  for(const w of sortedWorkouts())for(const ex of w.exercises||[]){const k=norm(ex.name);if(!k||seen.has(k))continue;seen.add(k);out.push({name:ex.name.trim(),e:exFor(ex)})}
  return out.slice(0,24);
}
function openPicker(replace){
  PK.q="";PK.replace=replace==null?null:replace;PK.group=recentExercises().length?"Recent":"Populair";
  let el=$("#picker");if(!el){el=document.createElement("div");el.id="picker";document.body.appendChild(el)}
  el.innerHTML='<div class="pk"><div class="sheet-head"><button class="link" data-pk="close">Sluiten</button><h2>'+(replace!=null?"Oefening wisselen":"Oefening kiezen")+'</h2><span style="width:60px"></span></div>'+
    '<div class="pk-search"><input id="pkQ" type="search" placeholder="Zoek oefening (Engels), bv. squat" autocomplete="off"></div>'+
    '<div class="chips pk-chips" id="pkChips"></div><div class="pk-body" id="pkBody"></div></div>';
  el.classList.add("open");renderPicker();
}
function closePicker(){const el=$("#picker");if(el){el.classList.remove("open");el.innerHTML=""}}
function renderPicker(){
  const rec=recentExercises();
  const groups=EXGROUPS.filter(g=>g!=="Recent"||rec.length);
  $("#pkChips").innerHTML=groups.map(g=>'<button class="chip '+(PK.group===g&&!PK.q?"on":"")+'" data-pk="group" data-v="'+g+'">'+g+'</button>').join("");
  const q=norm(PK.q);let items=[],extra="";
  if(q){items=EX.filter(e=>norm(e.name).includes(q)||norm(e.muscle).includes(q)).sort((a,b)=>b.pop-a.pop).slice(0,60).map(e=>({name:e.name,e}));
    extra='<button class="pk-custom" data-pk="custom">+ “'+esc(PK.q.trim())+'” toevoegen als eigen oefening</button>'}
  else if(PK.group==="Recent")items=rec;
  else if(PK.group==="Populair")items=EX.filter(e=>e.pop).map(e=>({name:e.name,e}));
  else if(PK.group==="Alles")items=EX.filter(e=>e.pop).concat(EX.filter(e=>!e.pop).slice(0,80)).map(e=>({name:e.name,e}));
  else items=EX.filter(e=>e.group===PK.group).sort((a,b)=>b.pop-a.pop).slice(0,80).map(e=>({name:e.name,e}));
  PK.items=items;
  $("#pkBody").innerHTML=extra+(items.length?'<div class="pk-grid">'+items.map((it,i)=>'<button class="pk-card" data-pk="pick" data-i="'+i+'">'+exThumb(it.e,"pk-img")+'<b>'+esc(it.name)+'</b><span>'+(it.e?esc(it.e.muscle):"eigen oefening")+'</span></button>').join("")+'</div>':(EX.length?'<div class="empty">Geen oefeningen gevonden.</div>':'<div class="empty">Oefeningen laden…</div>'))+
    (!q&&PK.group!=="Recent"&&PK.group!=="Populair"?'<div class="small muted" style="text-align:center;margin:14px 0">Zoek om alle '+EX.length+' oefeningen te doorzoeken</div>':'');
}
function pickExercise(it){
  const d=S.draft;if(!d)return;
  const entry={name:it.name,exId:it.e?it.e.id:undefined};
  if(S.sheet==="wtpl"){if(PK.replace!=null&&d.exercises[PK.replace])Object.assign(d.exercises[PK.replace],entry);else d.exercises.push(Object.assign(entry,{sets:3}));
    const idx=PK.replace!=null?PK.replace:d.exercises.length-1;closePicker();renderSheet();
    setTimeout(()=>{const box=document.querySelectorAll("#sheet .ex")[idx];if(box)box.scrollIntoView({block:"center",behavior:"smooth"})},60);return}
  if(PK.replace!=null&&d.exercises[PK.replace]){Object.assign(d.exercises[PK.replace],entry)}
  else{const prev=lastTimeFor(it.name,d.id,d.date);const n=prev?Math.max(1,prev.ex.sets.length):3;d.exercises.push(Object.assign(entry,{sets:Array.from({length:n},()=>blankSet())}))}
  const idx=PK.replace!=null?PK.replace:d.exercises.length-1;
  closePicker();renderSheet();
  setTimeout(()=>{const box=document.querySelectorAll("#sheet .ex")[idx];if(box)box.scrollIntoView({block:"center",behavior:"smooth"})},60);
}
function exInfo(i){
  const ex=S.draft.exercises[i],e=exFor(ex);
  const ov=document.createElement("div");ov.className="exinfo";
  ov.innerHTML='<div class="exi-card">'+(e?'<div class="exi-img">'+exThumb(e,"exi-ph")+'</div>':'')+'<h3>'+esc(ex.name)+'</h3><p>'+(e?esc(e.muscle)+(e.name!==ex.name?' · '+esc(e.name):''):'Eigen oefening, zonder foto')+'</p>'+
    '<button class="btn primary block" data-x="swap">↺ Andere oefening kiezen</button><button class="btn block" data-x="close" style="margin-top:8px">Sluiten</button></div>';
  ov.addEventListener("click",ev=>{const b=ev.target.closest("[data-x]");if(b&&b.dataset.x==="swap"){ov.remove();openPicker(i)}else if(b||ev.target===ov)ov.remove()});
  document.body.appendChild(ov);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-pk]");if(!b)return;ev.stopPropagation();
  const a=b.dataset.pk;
  if(a==="close")closePicker();
  else if(a==="group"){PK.group=b.dataset.v;PK.q="";const q=$("#pkQ");if(q)q.value="";renderPicker();$("#pkBody").scrollTop=0}
  else if(a==="pick"){const it=PK.items[+b.dataset.i];if(it)pickExercise(it)}
  else if(a==="custom"){const n=PK.q.trim();if(n)pickExercise({name:n.charAt(0).toUpperCase()+n.slice(1),e:null})}
},true);
document.addEventListener("input",ev=>{if(ev.target.id==="pkQ"){PK.q=ev.target.value;renderPicker()}});

document.addEventListener("click",async ev=>{
  const tabB=ev.target.closest("[data-tab]");
  if(tabB){S.tab=tabB.dataset.tab;try{sessionStorage.setItem("gym_tab",S.tab)}catch(e){}history.replaceState(null,"","#"+S.tab);render();window.scrollTo(0,0);return}

  const sg=ev.target.closest("[data-seg]");if(sg&&S.draft){const k=sg.dataset.seg;S.draft[k]=S.draft[k]===sg.dataset.v&&k!=="status"&&k!=="meal"?"":sg.dataset.v;renderSheet();return}
  if(ev.target.id==="sheetWrap"){closeSheet();return}
  const a=ev.target.closest("[data-act]");if(!a)return;
  const act=a.dataset.act,d=S.draft;
  switch(act){
    case "newWorkout":openSheet("workout",{id:uid(),date:today(),name:"",note:"",exercises:[]});break;
    case "wname":d.name=a.dataset.v;renderSheet();break;
    case "startTpl":{const t=getWT().find(x=>x.id===a.dataset.id);if(t){openSheet("workout",workoutFromTpl(t));toast("“"+t.name+"” geladen, vul je gewicht en reps in")}break}
    case "loadTpl":{const t=getWT().find(x=>x.id===a.dataset.id);if(t){const w=workoutFromTpl(t);d.name=w.name;d.tplId=t.id;d.exercises=w.exercises;renderSheet()}break}
    case "newTpl":openSheet("wtpl",{id:uid(),name:"",exercises:[]});break;
    case "editTpl":{const t=getWT().find(x=>x.id===a.dataset.id);if(t)openSheet("wtpl",clone(t));break}
    case "tplSets":{const ex=d.exercises[+a.dataset.i];ex.sets=Math.max(1,Math.min(10,num(ex.sets)+(+a.dataset.d)));renderSheet();break}
    case "tplUp":case "tplDown":{const i=+a.dataset.i,j=act==="tplUp"?i-1:i+1;if(j<0||j>=d.exercises.length)break;[d.exercises[i],d.exercises[j]]=[d.exercises[j],d.exercises[i]];renderSheet();break}
    case "saveTpl":{if(!(d.name||"").trim()){toast("Geef je schema een naam");break}
      const l=getWT(),ex=d.exercises.map(e=>({name:e.name,exId:e.exId,sets:num(e.sets)||3}));if(!ex.length){toast("Voeg eerst oefeningen toe");break}
      const i=l.findIndex(x=>x.id===d.id);const t={id:d.id,name:d.name.trim(),exercises:ex};if(i>=0)l[i]=t;else l.push(t);saveWT(l);closeSheet();render();toast("Schema “"+t.name+"” opgeslagen 💾");break}
    case "delTpl":{if(!S.confirmDel){S.confirmDel=true;renderSheet();break}saveWT(getWT().filter(x=>x.id!==d.id));closeSheet();render();toast("Schema verwijderd");break}
    case "saveAsTpl":if(saveAsTpl(d))renderSheet();break;
    case "exInfo":exInfo(+a.dataset.i);break;
    case "editWorkout":{const w=S.workouts.find(x=>x.id===a.dataset.id);if(w)openSheet("workout",clone(w));break}
    case "newContent":openSheet("content",{id:uid(),title:"",hook:"",status:"Idee",format:"Reel",platform:"Instagram",date:"",notes:""});break;
    case "editContent":{if(ev.target.closest(".adv"))break;const c=S.content.find(x=>x.id===a.dataset.id);if(c)openSheet("content",clone(c));break}
    case "advance":{ev.stopPropagation();const c=S.content.find(x=>x.id===a.dataset.id);if(!c)break;const i=STATUSES.indexOf(c.status);if(i<0||i>=STATUSES.length-1)break;
      const n=clone(c);n.status=STATUSES[i+1];if(n.status==="Gepost"&&!n.date)n.date=today();
      try{await Store.save("content",n);toast("→ "+n.status)}catch(e){toast(failMsg(e))}break}
    case "close":closeSheet();break;
    case "settings":openSheet("settings",{});break;
    case "export":exportBackup();break;
    case "enter":hideWelcome();break;
    case "streak":openSheet("streak",{});break;
    case "shareStreak":shareStreak();break;
    case "update":doUpdate();break;

    case "welcomeOn":lsSet(WKEY,"");renderSheet();break;
    case "welcomeOff":lsSet(WKEY,"1");renderSheet();break;
    case "previewWelcome":showWelcome(true);break;
    case "addEx":openPicker();break;
    case "delEx":d.exercises.splice(+a.dataset.i,1);renderSheet();break;
    case "addSet":{const ex=d.exercises[+a.dataset.i];const p=ex.sets[ex.sets.length-1];ex.sets.push(blankSet(p));renderSheet();break}
    case "delSet":{const ex=d.exercises[+a.dataset.i];ex.sets.splice(+a.dataset.j,1);renderSheet();break}
    case "copyPrev":{const p=lastWorkoutNamed(d.name,d.id);if(p){d.exercises=p.exercises.map(e=>({name:e.name,exId:e.exId,sets:(e.sets||[]).map(()=>({kg:"",reps:""}))}));renderSheet();toast("Oefeningen gekopieerd, vorige waarden staan als hint")}break}
    case "saveWorkout":{
      const w=clone(d);w.name=(w.name||"").trim()||"Training";
      w.exercises=(w.exercises||[]).map(e=>({name:(e.name||"").trim(),exId:e.exId||undefined,sets:(e.sets||[]).filter(s=>String(s.kg).trim()!==""||String(s.reps).trim()!=="").map(s=>({kg:num(s.kg),reps:num(s.reps)}))})).filter(e=>e.name||e.sets.length);
      if(!w.exercises.length){toast("Voeg minstens één oefening toe");break}
      if(!w.createdAt)w.createdAt=Date.now();

      break}
    case "saveContent":{
      const c=clone(d);c.title=(c.title||"").trim();
      if(!c.title&&!(c.hook||"").trim()){toast("Geef het idee een titel");break}

    case "addFood":openSheet("food",{mode:"search",meal:a.dataset.meal||defaultMeal(),date:S.foodDate||today(),q:""});setTimeout(()=>{const q=$("#foodQ");if(q)q.focus()},350);break;
    case "editFood":{const e=S.food.find(x=>x.id===a.dataset.id);if(!e)break;
      if(e.per100)openSheet("food",{mode:"detail",editId:e.id,meal:e.meal,date:e.date,item:{name:e.name,per100:e.per100,por:num(e.grams)||100,u:""},grams:e.grams});

    case "pickFood":{const it=S.foodLists[a.dataset.src][+a.dataset.i];if(!it)break;
      if(it.per100){d.mode="detail";d.item=it;d.grams=it.por}else{d.mode="manual";Object.assign(d,{name:it.name},it.fixed)}
      renderSheet();break}

    case "foodBack":d.mode="search";renderSheet();break;

    case "saveFood":{a.disabled=true;try{if(await saveFoodEntry()){const was=d.editId;closeSheet();toast(was?"Opgeslagen":"Toegevoegd 🍽️")}else a.disabled=false}catch(e){a.disabled=false;toast(failMsg(e))}break}
    case "delFood":if(!S.confirmDel){S.confirmDel=true;renderSheet();break}

    case "tplNew":{const t=getTpls(),cur=t.list.find(x=>x.id===t.active),id=uid();t.list.push({id,name:"Template "+(t.list.length+1),p:cur.p,c:cur.c,f:cur.f});t.active=id;saveTpls(t);renderSheet();render();setTimeout(()=>{const n=$("#sheet .tpl-name");if(n){n.focus();n.select()}},50);break}

document.addEventListener("input",ev=>{
  const tt=ev.target;
  if(tt.id==="foodQ"&&S.draft){S.draft.q=tt.value;const r=$("#foodResults");if(r)r.innerHTML=foodResults(tt.value);return}
  if(tt.id==="foodG"&&S.draft){S.draft.grams=tt.value;const fc=$("#foodCalc");if(fc)fc.innerHTML=calcBox(calc(S.draft.item.per100,num(tt.value)));return}
  if(tt.dataset.goal==="water"){const v=parseInt(tt.value,10);if(v>0){setWaterGoal(Math.min(v,20));render()}return}
  if(tt.dataset.tpl){tplUpdate(tt.dataset.tpl,tt.value);return}
  const t=ev.target;if(!S.draft||!t.dataset.f)return;
  const f=t.dataset.f;
  if(t.dataset.set!=null){S.draft.exercises[+t.dataset.ex].sets[+t.dataset.set][f]=t.value}
  else if(f==="exname"){S.draft.exercises[+t.dataset.ex].name=t.value}
  else S.draft[f]=t.value;
  if(S.sheet==="food"&&S.draft.mode==="manual"){
    if(f==="kcal")S.draft.kcalManual=t.value.trim()!=="";
    else if("pcf".includes(f)&&f.length===1&&!S.draft.kcalManual){const k=kcalOf(S.draft.p,S.draft.c,S.draft.f);S.draft.kcal=k||"";const ki=$('#sheet [data-f="kcal"]');if(ki)ki.value=k||""}
  }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="progSel"){S.progEx=t.value;render();return}
  if(t.id==="nameSet"){const v=t.value.trim();lsSet(NKEY,v?v.charAt(0).toUpperCase()+v.slice(1):"");toast(v?"Naam opgeslagen":"Naam verwijderd");return}
  if(t.id==="importFile"){if(t.files&&t.files[0])importBackup(t.files[0]);t.value="";return}
  if(S.sheet!=="workout")return;
  if(t.dataset.f==="exname")refreshEx(+t.dataset.ex);
  else if(t.dataset.f==="name")renderSheet();
  else if(t.dataset.f==="date")S.draft.exercises.forEach((_,i)=>refreshEx(i));
});
/* in-place updates so the keyboard/focus is not lost while typing */
function refreshEx(i){
  const d=S.draft,ex=d.exercises[i],box=document.querySelectorAll("#sheet .ex")[i];if(!box||!ex)return;
  const prev=lastTimeFor(ex.name,d.id,d.date);
  let p=box.querySelector(".prev");
  if(prev){if(!p){p=document.createElement("div");p.className="prev";box.querySelector(".ex-head").after(p)}
    p.textContent="Vorige keer ("+fmtDate(prev.w.date,{day:"numeric",month:"short"})+"): "+setsStr(prev.ex.sets)}
  else if(p)p.remove();
  box.querySelectorAll('[data-f="kg"],[data-f="reps"]').forEach(inp=>{const ph=prev&&prev.ex.sets[+inp.dataset.set];inp.placeholder=ph?String(ph[inp.dataset.f]):inp.dataset.f});
}
function refreshCopy(){
  const d=S.draft,old=$("#sheet .copybox");if(old)old.remove();
  const prevW=lastWorkoutNamed(d.name,d.id);
  if(prevW&&!d.exercises.some(e=>(e.name||"").trim())){
    const b=document.createElement("button");b.className="copybox";b.dataset.act="copyPrev";
    b.textContent="↻ Kopieer vorige “"+prevW.name+"” ("+fmtDate(prevW.date,{day:"numeric",month:"short"})+")";
    $("#sheet .grid2").after(b);
  }
}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(["train","prog","food","content"].includes(h)&&h!==S.tab){S.tab=h;render()}});

render();
Store.init();
/* eenmalig: gymdag van maandag 16 november 2026 achteraf toevoegen */
(function(){
  const K="gym_once_20261116",D="2026-11-16";
  if(lsGet(K)||today()>"2026-11-23")return;
  if(!S.workouts.some(w=>w.date===D)){
    S.workouts.push({id:"once-"+D,date:D,name:"Gymdag",note:"Achteraf ingevuld",createdAt:Date.now(),exercises:[]});
    Store.persist();render();
  }
  lsSet(K,"1");
})();
loadExercises();
showWelcome();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
setTimeout(()=>checkUpdate(false),1500);
/* geen zoom: knijpen en dubbeltikken uitschakelen */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,ev=>ev.preventDefault(),{passive:false}));
document.addEventListener("touchmove",ev=>{if(ev.touches&&ev.touches.length>1)ev.preventDefault()},{passive:false});
(function(){let last=0;document.addEventListener("touchend",ev=>{const now=Date.now();if(now-last<300&&!ev.target.closest("input,textarea,select")){ev.preventDefault();const b=ev.target.closest("button,[data-act],[data-tab],[data-pk],label");if(b)b.click()}last=now},{passive:false})})();
/* iOS home-screen fix: after the keyboard closes, iOS can keep the viewport shrunk and leave a black band at the bottom. Force a re-measure. */
(function(){
  let maxVH=window.innerHeight;
  window.addEventListener("resize",()=>{maxVH=Math.max(maxVH,window.innerHeight)});
  function restore(){
    if(maxVH-window.innerHeight<=4)return;
    const y=window.scrollY,sb=document.querySelector("#sheet .sheet-body"),st=sb?sb.scrollTop:0;
    document.body.style.display="none";void document.body.offsetHeight;document.body.style.display="";
    window.scrollTo(0,y);if(sb)sb.scrollTop=st;
  }
  document.addEventListener("focusout",ev=>{if(ev.target.matches("input,textarea,select"))setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches("input,textarea,select"))restore()},140)});
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")setTimeout(restore,200)});
})();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate(false)});
})();
</script>
